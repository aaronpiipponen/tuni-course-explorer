# Embedding runtime/generation contract and search, comparison, recommendation, and prerequisite
# route policy, validated by course_explorer.config settings, with the embedding runtime values
# also projected to Compose by course_explorer_admin.compose.
EMBEDDING_HOST = "127.0.0.1"
EMBEDDING_PORT = 8081
EMBEDDING_MODEL = "BAAI/bge-m3"
EMBEDDING_POOLING = "cls"
EMBEDDING_NORMALIZATION = 2
EMBEDDING_THREADS = 2
EMBEDDING_CONTEXT_SIZE = 2048
EMBEDDING_REQUEST_TIMEOUT_SECONDS = 600
EMBEDDING_MAX_ATTEMPTS = 3
EMBEDDING_RETRY_BACKOFF_SECONDS = 0.5
EMBEDDING_GENERATION_BATCH_SIZE = 32
EMBEDDING_CHUNK_MAX_CHARACTERS = 1200
EMBEDDING_CHUNK_OVERLAP_CHARACTERS = 120
EMBEDDING_ARTIFACT_URL = "https://huggingface.co/ggml-org/bge-m3-Q8_0-GGUF/resolve/9eba04c5d75ba5a1595e45de734d36bef4e5cb98/bge-m3-q8_0.gguf"
EMBEDDING_ARTIFACT_PATH = "models/bge-m3-q8_0.gguf"
EMBEDDING_ARTIFACT_SHA256 = "aa473d51f451a22f0fcf39ba3330c14bed38a385712b1113440f69df4047a173"
EMBEDDING_SERVER_IMAGE = "ghcr.io/ggml-org/llama.cpp:server@sha256:ce6b9639bea61c87e641d0f5622229c23400fb84dc4d91075240e8983d7c3b47"
EMBEDDING_RUNTIME_REVISION = "df03399b885831b2a1603b3abb0d8c156808e363"
EMBEDDING_CONTROLLER_STATE_ROOT = "data/embeddings/controller"
# Catalogue hub: mean of the unit chunk vectors of every completed compatible chunk of the served
# dataset. It is subtracted from stored and query vectors before cosine so unrelated course pairs
# score near zero. The hub in this example is computed from its own bundled dataset.
EMBEDDING_HUB_VECTOR = { path = "config/derived/embedding-hub.json" }
# Outcomes-field hub: mean of the unit chunk vectors of every completed compatible outcomes chunk.
# Learning-outcome text shares a template, so this field-specific hub is subtracted for outcomes.
EMBEDDING_OUTCOMES_HUB_VECTOR = { path = "config/derived/embedding-outcomes-hub.json" }
SEMANTIC_SEARCH_MIN_SCORE = 0.30
FUZZY_SEARCH_MIN_SCORE = 80
# Policy for the one embedding request a search query makes. The timeout of that request is in
# seconds and is greater than 0, and its attempt count includes the first attempt and is at least 1.
# Raising either value lets a foreground search wait longer for a slow embedding service. For that
# request these values replace EMBEDDING_REQUEST_TIMEOUT_SECONDS and EMBEDDING_MAX_ATTEMPTS, which
# the embedding stage reads.
SEARCH_EMBEDDING_REQUEST_TIMEOUT_SECONDS = 5
SEARCH_EMBEDDING_MAX_ATTEMPTS = 1
SEARCH_TIER_PRIORITY = ["exact_code", "substring", "fuzzy_name", "semantic"]
# Course-comparison policy. Weights normalize over the fields available on both courses. The overlap
# meters are graded (character-weighted mean of each source chunk's best centred cosine) and
# calibrated so the floor maps to 0 and the ceiling to 100. Unrelated pairs score near zero.
COMPARISON_NAME_WEIGHT = 0.10
COMPARISON_CONTENT_WEIGHT = 0.45
COMPARISON_OUTCOMES_WEIGHT = 0.45
COMPARISON_OVERLAP_FLOOR = 0.20
COMPARISON_OVERLAP_CEILING = 0.90
COMPARISON_HEAVY_OVERLAP_PERCENT = 70
COMPARISON_PARTIAL_OVERLAP_PERCENT = 30
COMPARISON_SAME_AREA_PERCENT = 35
COMPARISON_LOOSE_RELATED_PERCENT = 20
# Maximum combined compact nodes for exact PATH before scalar greedy approximation.
PREREQUISITE_PATH_MAX_COMPACT_NODES = 700000
# Whole-basis similarity recommendation policy. The candidate pool is a raw-cosine index-backed
# retrieval. The returned list is cut off only by the hub-centred relatedness floor (no result-count
# cap), so a lower floor returns more qualifying courses. Relatedness is the hub-centred cosine
# to the trimmed whole-basis profile.
RECOMMENDATION_CHUNK_TOP_K = 40
RECOMMENDATION_MIN_RELATEDNESS = 0.33
RECOMMENDATION_NEAR_DUPLICATE_PERCENT = 90
RECOMMENDATION_OVERLAP_PENALTY_WEIGHT = 0.0
