# Deployment values the serving script sources: the feature web unit and its loopback port, and the
# administration web unit and its loopback port. The ports match WEB_PORT and ADMIN_WEB_PORT in
# examples/config/web.toml and examples/config/admin_web.toml. A copy placed at deploy/serving.conf
# beside the script carries the unit names the host's systemd units use.
DEPLOY_WEB_UNIT=tuni-course-explorer-web.service
DEPLOY_WEB_PORT=8037
DEPLOY_ADMIN_UNIT=tuni-course-explorer-admin-web.service
DEPLOY_ADMIN_PORT=8039
