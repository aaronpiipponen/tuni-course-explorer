  <text x="329.2" y="167" text-anchor="end" font-size="14" fill="#ececf2">Two equivalents, 67.109 MB bound</text>
  <rect x="341.2" y="140" width="457.4" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="806.6" y="155" font-size="14" fill="#a3a4b8">2.23</text>
