<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 388" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Worker glibc heap in use and free by concurrency</title>
  <desc id="d">The in-use and free parts of one worker's glibc heap at sequential, four concurrent and eight concurrent requests, and at eight concurrent requests with the arena cap, in MB.</desc>
  <rect width="960" height="388" rx="12" fill="#232434"/>
  <rect x="61" y="33" width="14" height="14" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="96" y="45" font-size="14" fill="#a3a4b8">In use</text>
  <rect x="183.4" y="33" width="14" height="14" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="218.4" y="45" font-size="14" fill="#a3a4b8">Free</text>
  <line x1="307.6" y1="72" x2="307.6" y2="312" stroke="#a3a4b8" stroke-width="1"/>
  <text x="307.6" y="334" text-anchor="middle" font-size="14" fill="#a3a4b8">0</text>
  <line x1="448.4" y1="72" x2="448.4" y2="312" stroke="#4a4c6b" stroke-width="1"/>
  <text x="448.4" y="334" text-anchor="middle" font-size="14" fill="#a3a4b8">100</text>
  <line x1="589.2" y1="72" x2="589.2" y2="312" stroke="#4a4c6b" stroke-width="1"/>
  <text x="589.2" y="334" text-anchor="middle" font-size="14" fill="#a3a4b8">200</text>
  <line x1="730" y1="72" x2="730" y2="312" stroke="#4a4c6b" stroke-width="1"/>
  <text x="730" y="334" text-anchor="middle" font-size="14" fill="#a3a4b8">300</text>
  <line x1="870.8" y1="72" x2="870.8" y2="312" stroke="#4a4c6b" stroke-width="1"/>
  <text x="870.8" y="334" text-anchor="middle" font-size="14" fill="#a3a4b8">400</text>
  <text x="295.6" y="107" text-anchor="end" font-size="14" fill="#ececf2">Sequential</text>
  <rect x="307.6" y="80" width="81.7" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="397.3" y="95" font-size="14" fill="#a3a4b8">58</text>
  <rect x="307.6" y="104" width="56.3" height="20" rx="2" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="371.9" y="119" font-size="14" fill="#a3a4b8">40</text>
  <text x="295.6" y="167" text-anchor="end" font-size="14" fill="#ececf2">Four concurrent</text>
  <rect x="307.6" y="140" width="84.5" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="400.1" y="155" font-size="14" fill="#a3a4b8">60</text>
  <rect x="307.6" y="164" width="187.3" height="20" rx="2" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="502.9" y="179" font-size="14" fill="#a3a4b8">133</text>
  <text x="295.6" y="227" text-anchor="end" font-size="14" fill="#ececf2">Eight concurrent</text>
  <rect x="307.6" y="200" width="87.3" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="402.9" y="215" font-size="14" fill="#a3a4b8">62</text>
  <rect x="307.6" y="224" width="511.1" height="20" rx="2" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="826.7" y="239" font-size="14" fill="#a3a4b8">363</text>
  <text x="295.6" y="287" text-anchor="end" font-size="14" fill="#ececf2">Eight concurrent, arena cap 2</text>
  <rect x="307.6" y="260" width="85.9" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="401.5" y="275" font-size="14" fill="#a3a4b8">61</text>
  <rect x="307.6" y="284" width="208.4" height="20" rx="2" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="524" y="299" font-size="14" fill="#a3a4b8">148</text>
  <text x="589.2" y="364" text-anchor="middle" font-size="14" fill="#a3a4b8">Heap (MB)</text>
</svg>
