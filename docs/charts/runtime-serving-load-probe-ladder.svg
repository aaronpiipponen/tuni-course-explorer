  <text x="303.5" y="450" text-anchor="middle" font-size="14" fill="#a3a4b8">100</text>
  <line x1="492.6" y1="32" x2="492.6" y2="428" stroke="#4a4c6b" stroke-width="1"/>
  <text x="492.6" y="450" text-anchor="middle" font-size="14" fill="#a3a4b8">200</text>
  <line x1="681.7" y1="32" x2="681.7" y2="428" stroke="#4a4c6b" stroke-width="1"/>
