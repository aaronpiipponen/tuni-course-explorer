  <text x="102.4" y="91" text-anchor="end" font-size="14" fill="#ececf2">2 VUs</text>
  <rect x="114.4" y="76" width="270.4" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="392.8" y="91" font-size="14" fill="#a3a4b8">143</text>
