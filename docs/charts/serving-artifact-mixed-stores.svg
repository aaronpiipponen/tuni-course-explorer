<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 328" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Mixed load with shared and unshared stores</title>
  <desc id="d">Total and web core-seconds for the 80-request mixed load under unshared stores, shared stores and the unchanged product path. Shared stores cut total core-seconds from 44.98 to 38.39 and web core-seconds from 30.29 to 25.73.</desc>
  <rect width="960" height="328" rx="12" fill="#232434"/>
  <rect x="61" y="33" width="14" height="14" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="96" y="45" font-size="14" fill="#a3a4b8">Total core-seconds</text>
  <rect x="284.2" y="33" width="14" height="14" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="319.2" y="45" font-size="14" fill="#a3a4b8">Web core-seconds</text>
  <line x1="248.8" y1="72" x2="248.8" y2="252" stroke="#a3a4b8" stroke-width="1"/>
  <text x="248.8" y="274" text-anchor="middle" font-size="14" fill="#a3a4b8">0</text>
  <line x1="368.2" y1="72" x2="368.2" y2="252" stroke="#4a4c6b" stroke-width="1"/>
  <text x="368.2" y="274" text-anchor="middle" font-size="14" fill="#a3a4b8">25</text>
  <line x1="487.5" y1="72" x2="487.5" y2="252" stroke="#4a4c6b" stroke-width="1"/>
  <text x="487.5" y="274" text-anchor="middle" font-size="14" fill="#a3a4b8">50</text>
  <line x1="606.9" y1="72" x2="606.9" y2="252" stroke="#4a4c6b" stroke-width="1"/>
  <text x="606.9" y="274" text-anchor="middle" font-size="14" fill="#a3a4b8">75</text>
  <line x1="726.2" y1="72" x2="726.2" y2="252" stroke="#4a4c6b" stroke-width="1"/>
  <text x="726.2" y="274" text-anchor="middle" font-size="14" fill="#a3a4b8">100</text>
  <line x1="845.6" y1="72" x2="845.6" y2="252" stroke="#4a4c6b" stroke-width="1"/>
  <text x="845.6" y="274" text-anchor="middle" font-size="14" fill="#a3a4b8">125</text>
  <text x="236.8" y="107" text-anchor="end" font-size="14" fill="#ececf2">Unshared stores</text>
  <rect x="248.8" y="80" width="214.8" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="471.6" y="95" font-size="14" fill="#a3a4b8">44.98</text>
  <rect x="248.8" y="104" width="144.6" height="20" rx="2" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="401.4" y="119" font-size="14" fill="#a3a4b8">30.29</text>
  <text x="236.8" y="167" text-anchor="end" font-size="14" fill="#ececf2">Shared stores</text>
  <rect x="248.8" y="140" width="183.3" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="440.1" y="155" font-size="14" fill="#a3a4b8">38.39</text>
  <rect x="248.8" y="164" width="122.8" height="20" rx="2" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="379.6" y="179" font-size="14" fill="#a3a4b8">25.73</text>
  <text x="236.8" y="227" text-anchor="end" font-size="14" fill="#ececf2">Unchanged product path</text>
  <rect x="248.8" y="200" width="485.8" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="742.6" y="215" font-size="14" fill="#a3a4b8">101.76</text>
  <rect x="248.8" y="224" width="358.7" height="20" rx="2" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="615.5" y="239" font-size="14" fill="#a3a4b8">75.12</text>
  <text x="547.2" y="304" text-anchor="middle" font-size="14" fill="#a3a4b8">Core-seconds</text>
</svg>
