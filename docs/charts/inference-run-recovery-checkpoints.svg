<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 268" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Published inferred sets and recorded target failures mid-run and after the run</title>
  <desc id="d">Two counts read on the selected dataset: published inferred sets rose from 727 at the mid-run stop on 2026-10-12 to 4,543 after the run finished, while recorded target failure rows fell from 145 to 0.</desc>
  <rect width="960" height="268" rx="12" fill="#232434"/>
  <rect x="61" y="33" width="14" height="14" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="96" y="45" font-size="14" fill="#a3a4b8">Published inferred sets</text>
  <rect x="326.2" y="33" width="14" height="14" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="361.2" y="45" font-size="14" fill="#a3a4b8">Recorded target failure rows</text>
  <line x1="274" y1="72" x2="274" y2="192" stroke="#a3a4b8" stroke-width="1"/>
  <text x="274" y="214" text-anchor="middle" font-size="14" fill="#a3a4b8">0</text>
  <line x1="390" y1="72" x2="390" y2="192" stroke="#4a4c6b" stroke-width="1"/>
  <text x="390" y="214" text-anchor="middle" font-size="14" fill="#a3a4b8">1,000</text>
  <line x1="506" y1="72" x2="506" y2="192" stroke="#4a4c6b" stroke-width="1"/>
  <text x="506" y="214" text-anchor="middle" font-size="14" fill="#a3a4b8">2,000</text>
  <line x1="622" y1="72" x2="622" y2="192" stroke="#4a4c6b" stroke-width="1"/>
  <text x="622" y="214" text-anchor="middle" font-size="14" fill="#a3a4b8">3,000</text>
  <line x1="738" y1="72" x2="738" y2="192" stroke="#4a4c6b" stroke-width="1"/>
  <text x="738" y="214" text-anchor="middle" font-size="14" fill="#a3a4b8">4,000</text>
  <line x1="854" y1="72" x2="854" y2="192" stroke="#4a4c6b" stroke-width="1"/>
  <text x="854" y="214" text-anchor="middle" font-size="14" fill="#a3a4b8">5,000</text>
  <text x="262" y="107" text-anchor="end" font-size="14" fill="#ececf2">Mid-run stop, 2026-10-12</text>
  <rect x="274" y="80" width="84.3" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="366.3" y="95" font-size="14" fill="#a3a4b8">727</text>
  <rect x="274" y="104" width="16.8" height="20" rx="2" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="298.8" y="119" font-size="14" fill="#a3a4b8">145</text>
  <text x="262" y="167" text-anchor="end" font-size="14" fill="#ececf2">Post-run read, 2026-10-25</text>
  <rect x="274" y="140" width="527" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="809" y="155" font-size="14" fill="#a3a4b8">4,543</text>
  <rect x="274" y="164" width="0" height="20" rx="2" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="282" y="179" font-size="14" fill="#a3a4b8">0</text>
  <text x="564" y="244" text-anchor="middle" font-size="14" fill="#a3a4b8">Records</text>
</svg>
