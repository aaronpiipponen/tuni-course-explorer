  <title id="t">Summed component memory at the stop level</title>
  <desc id="d">Current and summed component peak memory of the web, database and embedding components at the stop level, or at the last valid level where the next level failed, for four stacks under the light-only and mixed profiles. The peak series adds each component's own peak, which need not occur at the same moment, so it is an upper bound. The pre-admission summed peaks are the highest at 8.25 GB.</desc>
