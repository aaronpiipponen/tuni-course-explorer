<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 388" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Route parity across the measured passes</title>
  <desc id="d">Rows identical to the baseline and rows with a differing approximate route in each pass. The final module-drawing pass has 104 identical rows and six differing approximate rows.</desc>
