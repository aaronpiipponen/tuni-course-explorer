  <rect x="206.8" y="104" width="10.6" height="20" rx="2" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="225.4" y="119" font-size="14" fill="#a3a4b8">2</text>
  <text x="194.8" y="167" text-anchor="end" font-size="14" fill="#ececf2">First correction</text>
  <rect x="206.8" y="140" width="573.7" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="788.5" y="155" font-size="14" fill="#a3a4b8">108</text>
  <rect x="206.8" y="164" width="10.6" height="20" rx="2" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
