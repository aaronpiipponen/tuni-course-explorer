  <line x1="605.2" y1="72" x2="605.2" y2="312" stroke="#4a4c6b" stroke-width="1"/>
  <text x="605.2" y="334" text-anchor="middle" font-size="14" fill="#a3a4b8">75</text>
  <line x1="738" y1="72" x2="738" y2="312" stroke="#4a4c6b" stroke-width="1"/>
  <text x="738" y="334" text-anchor="middle" font-size="14" fill="#a3a4b8">100</text>
  <line x1="870.8" y1="72" x2="870.8" y2="312" stroke="#4a4c6b" stroke-width="1"/>
  <text x="870.8" y="334" text-anchor="middle" font-size="14" fill="#a3a4b8">125</text>
  <text x="194.8" y="107" text-anchor="end" font-size="14" fill="#ececf2">Initial compact</text>
