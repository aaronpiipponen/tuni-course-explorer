  <text x="285.6" y="45" font-size="14" fill="#a3a4b8">Differing approximate rows</text>
  <line x1="206.8" y1="72" x2="206.8" y2="312" stroke="#a3a4b8" stroke-width="1"/>
  <text x="206.8" y="334" text-anchor="middle" font-size="14" fill="#a3a4b8">0</text>
  <line x1="339.6" y1="72" x2="339.6" y2="312" stroke="#4a4c6b" stroke-width="1"/>
  <text x="339.6" y="334" text-anchor="middle" font-size="14" fill="#a3a4b8">25</text>
  <line x1="472.4" y1="72" x2="472.4" y2="312" stroke="#4a4c6b" stroke-width="1"/>
