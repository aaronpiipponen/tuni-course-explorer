  <text x="194.8" y="227" text-anchor="end" font-size="14" fill="#ececf2">Second correction</text>
  <rect x="206.8" y="200" width="573.7" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
