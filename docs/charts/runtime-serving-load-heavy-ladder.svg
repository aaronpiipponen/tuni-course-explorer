  <line x1="297.2" y1="32" x2="297.2" y2="428" stroke="#4a4c6b" stroke-width="1"/>
  <text x="297.2" y="450" text-anchor="middle" font-size="14" fill="#a3a4b8">20,000</text>
  <line x1="480" y1="32" x2="480" y2="428" stroke="#4a4c6b" stroke-width="1"/>
  <text x="480" y="450" text-anchor="middle" font-size="14" fill="#a3a4b8">40,000</text>
  <line x1="662.8" y1="32" x2="662.8" y2="428" stroke="#4a4c6b" stroke-width="1"/>
  <text x="662.8" y="450" text-anchor="middle" font-size="14" fill="#a3a4b8">60,000</text>
