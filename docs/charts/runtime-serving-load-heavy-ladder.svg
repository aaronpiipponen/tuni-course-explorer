  <text x="728" y="163" font-size="14" fill="#a3a4b8">66,253</text>
  <text x="102.4" y="199" text-anchor="end" font-size="14" fill="#ececf2">6 VUs</text>
  <rect x="114.4" y="184" width="619.9" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
