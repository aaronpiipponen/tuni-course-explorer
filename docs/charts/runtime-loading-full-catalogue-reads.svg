<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Full-catalogue command and read wall time before and after the read projection</title>
  <desc id="d">Command and read wall times before and after the projected and scoped read path. Unified search uses both range minima. Prerequisites uses an approximate before value and the after range minimum. Other reads use their recorded values.</desc>
