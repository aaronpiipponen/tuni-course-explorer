  <text x="218.4" y="45" font-size="14" fill="#a3a4b8">After</text>
  <line x1="316" y1="72" x2="316" y2="372" stroke="#a3a4b8" stroke-width="1"/>
  <text x="316" y="394" text-anchor="middle" font-size="14" fill="#a3a4b8">0</text>
  <line x1="452.6" y1="72" x2="452.6" y2="372" stroke="#4a4c6b" stroke-width="1"/>
  <text x="452.6" y="394" text-anchor="middle" font-size="14" fill="#a3a4b8">5</text>
  <line x1="589.2" y1="72" x2="589.2" y2="372" stroke="#4a4c6b" stroke-width="1"/>
  <text x="589.2" y="394" text-anchor="middle" font-size="14" fill="#a3a4b8">10</text>
  <line x1="725.8" y1="72" x2="725.8" y2="372" stroke="#4a4c6b" stroke-width="1"/>
  <text x="725.8" y="394" text-anchor="middle" font-size="14" fill="#a3a4b8">15</text>
  <line x1="862.4" y1="72" x2="862.4" y2="372" stroke="#4a4c6b" stroke-width="1"/>
  <text x="862.4" y="394" text-anchor="middle" font-size="14" fill="#a3a4b8">20</text>
  <text x="304" y="107" text-anchor="end" font-size="14" fill="#ececf2">Unified search, lower bound</text>
  <rect x="316" y="80" width="423.5" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="747.5" y="95" font-size="14" fill="#a3a4b8">15.5</text>
