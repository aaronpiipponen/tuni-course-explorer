  <text x="720.1" y="155" font-size="14" fill="#a3a4b8">14.5</text>
  <rect x="316" y="164" width="64.2" height="20" rx="2" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="388.2" y="179" font-size="14" fill="#a3a4b8">2.35</text>
  <text x="304" y="227" text-anchor="end" font-size="14" fill="#ececf2">Coverage command</text>
  <rect x="316" y="200" width="508.2" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="832.2" y="215" font-size="14" fill="#a3a4b8">18.6</text>
