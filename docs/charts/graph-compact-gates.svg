<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 216" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Gate records for the active-off YKT.SOA.303 row</title>
  <desc id="d">Gate records for YKT.SOA.303 with Recommended and Inferred on and Active only off in the first corrected pass, the second corrected pass and the module-drawing pass. The count falls from 38,523 to 2,845 records and then rises to 3,348.</desc>
  <rect width="960" height="216" rx="12" fill="#232434"/>
  <line x1="206.8" y1="32" x2="206.8" y2="140" stroke="#a3a4b8" stroke-width="1"/>
  <text x="206.8" y="162" text-anchor="middle" font-size="14" fill="#a3a4b8">0</text>
  <line x1="366.5" y1="32" x2="366.5" y2="140" stroke="#4a4c6b" stroke-width="1"/>
  <text x="366.5" y="162" text-anchor="middle" font-size="14" fill="#a3a4b8">10,000</text>
  <line x1="526.2" y1="32" x2="526.2" y2="140" stroke="#4a4c6b" stroke-width="1"/>
  <text x="526.2" y="162" text-anchor="middle" font-size="14" fill="#a3a4b8">20,000</text>
  <line x1="685.9" y1="32" x2="685.9" y2="140" stroke="#4a4c6b" stroke-width="1"/>
  <text x="685.9" y="162" text-anchor="middle" font-size="14" fill="#a3a4b8">30,000</text>
  <line x1="845.6" y1="32" x2="845.6" y2="140" stroke="#4a4c6b" stroke-width="1"/>
  <text x="845.6" y="162" text-anchor="middle" font-size="14" fill="#a3a4b8">40,000</text>
  <text x="194.8" y="55" text-anchor="end" font-size="14" fill="#ececf2">First correction</text>
  <rect x="206.8" y="40" width="615.2" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="830" y="55" font-size="14" fill="#a3a4b8">38,523</text>
  <text x="194.8" y="91" text-anchor="end" font-size="14" fill="#ececf2">Second correction</text>
  <rect x="206.8" y="76" width="45.4" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="260.2" y="91" font-size="14" fill="#a3a4b8">2,845</text>
  <text x="194.8" y="127" text-anchor="end" font-size="14" fill="#ececf2">Module drawing</text>
  <rect x="206.8" y="112" width="53.5" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="268.3" y="127" font-size="14" fill="#a3a4b8">3,348</text>
  <text x="526.2" y="192" text-anchor="middle" font-size="14" fill="#a3a4b8">Gate records</text>
</svg>
