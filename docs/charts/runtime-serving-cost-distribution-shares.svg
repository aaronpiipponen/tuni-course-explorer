<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 388" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Worker process share of web CPU in the distribution gate</title>
  <desc id="d">Each worker process's share of the four worker processes' web CPU over the middle 90 seconds, with a new connection per request and with kept-alive connections.</desc>
  <rect width="960" height="388" rx="12" fill="#232434"/>
  <rect x="61" y="33" width="14" height="14" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="96" y="45" font-size="14" fill="#a3a4b8">New connection per request</text>
  <rect x="351.4" y="33" width="14" height="14" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="386.4" y="45" font-size="14" fill="#a3a4b8">Kept alive</text>
  <line x1="198.4" y1="72" x2="198.4" y2="312" stroke="#a3a4b8" stroke-width="1"/>
  <text x="198.4" y="334" text-anchor="middle" font-size="14" fill="#a3a4b8">0</text>
  <line x1="362.3" y1="72" x2="362.3" y2="312" stroke="#4a4c6b" stroke-width="1"/>
  <text x="362.3" y="334" text-anchor="middle" font-size="14" fill="#a3a4b8">20</text>
  <line x1="526.2" y1="72" x2="526.2" y2="312" stroke="#4a4c6b" stroke-width="1"/>
  <text x="526.2" y="334" text-anchor="middle" font-size="14" fill="#a3a4b8">40</text>
  <line x1="690.1" y1="72" x2="690.1" y2="312" stroke="#4a4c6b" stroke-width="1"/>
  <text x="690.1" y="334" text-anchor="middle" font-size="14" fill="#a3a4b8">60</text>
  <line x1="854" y1="72" x2="854" y2="312" stroke="#4a4c6b" stroke-width="1"/>
  <text x="854" y="334" text-anchor="middle" font-size="14" fill="#a3a4b8">80</text>
  <text x="186.4" y="107" text-anchor="end" font-size="14" fill="#ececf2">Worker process 1</text>
  <rect x="198.4" y="80" width="1" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="207.4" y="95" font-size="14" fill="#a3a4b8">0.12</text>
  <rect x="198.4" y="104" width="270.8" height="20" rx="2" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="477.2" y="119" font-size="14" fill="#a3a4b8">33.04</text>
  <text x="186.4" y="167" text-anchor="end" font-size="14" fill="#ececf2">Worker process 2</text>
  <rect x="198.4" y="140" width="231.6" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="438" y="155" font-size="14" fill="#a3a4b8">28.26</text>
  <rect x="198.4" y="164" width="258.3" height="20" rx="2" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="464.7" y="179" font-size="14" fill="#a3a4b8">31.52</text>
  <text x="186.4" y="227" text-anchor="end" font-size="14" fill="#ececf2">Worker process 3</text>
  <rect x="198.4" y="200" width="92.4" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="298.8" y="215" font-size="14" fill="#a3a4b8">11.27</text>
  <rect x="198.4" y="224" width="288.2" height="20" rx="2" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="494.6" y="239" font-size="14" fill="#a3a4b8">35.17</text>
  <text x="186.4" y="287" text-anchor="end" font-size="14" fill="#ececf2">Worker process 4</text>
  <rect x="198.4" y="260" width="494.6" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="701" y="275" font-size="14" fill="#a3a4b8">60.35</text>
  <rect x="198.4" y="284" width="2.1" height="20" rx="2" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="208.5" y="299" font-size="14" fill="#a3a4b8">0.26</text>
  <text x="526.2" y="364" text-anchor="middle" font-size="14" fill="#a3a4b8">Share of web CPU (percent)</text>
</svg>
