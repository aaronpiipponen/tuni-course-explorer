<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 288" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Memory bounds and measured peaks</title>
  <desc id="d">The retained-cache aggregate, the serving-tree proof limit, the summed process high-water marks, the cgroup maximum usage and the kernel proof ceiling, in GB.</desc>
  <rect width="960" height="288" rx="12" fill="#232434"/>
  <line x1="265.6" y1="32" x2="265.6" y2="212" stroke="#a3a4b8" stroke-width="1"/>
  <text x="265.6" y="234" text-anchor="middle" font-size="14" fill="#a3a4b8">0</text>
  <line x1="383.3" y1="32" x2="383.3" y2="212" stroke="#4a4c6b" stroke-width="1"/>
  <text x="383.3" y="234" text-anchor="middle" font-size="14" fill="#a3a4b8">1</text>
  <line x1="501" y1="32" x2="501" y2="212" stroke="#4a4c6b" stroke-width="1"/>
  <text x="501" y="234" text-anchor="middle" font-size="14" fill="#a3a4b8">2</text>
  <line x1="618.6" y1="32" x2="618.6" y2="212" stroke="#4a4c6b" stroke-width="1"/>
  <text x="618.6" y="234" text-anchor="middle" font-size="14" fill="#a3a4b8">3</text>
  <line x1="736.3" y1="32" x2="736.3" y2="212" stroke="#4a4c6b" stroke-width="1"/>
  <text x="736.3" y="234" text-anchor="middle" font-size="14" fill="#a3a4b8">4</text>
  <line x1="854" y1="32" x2="854" y2="212" stroke="#4a4c6b" stroke-width="1"/>
  <text x="854" y="234" text-anchor="middle" font-size="14" fill="#a3a4b8">5</text>
  <text x="253.6" y="55" text-anchor="end" font-size="14" fill="#ececf2">Retained-cache aggregate</text>
  <rect x="265.6" y="40" width="126.4" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="400" y="55" font-size="14" fill="#a3a4b8">1.074</text>
  <text x="253.6" y="91" text-anchor="end" font-size="14" fill="#ececf2">Serving-tree proof limit</text>
  <rect x="265.6" y="76" width="505.4" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="779" y="91" font-size="14" fill="#a3a4b8">4.295</text>
  <text x="253.6" y="127" text-anchor="end" font-size="14" fill="#ececf2">Summed VmHWM</text>
  <rect x="265.6" y="112" width="328.1" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="601.7" y="127" font-size="14" fill="#a3a4b8">2.788</text>
  <text x="253.6" y="163" text-anchor="end" font-size="14" fill="#ececf2">Cgroup maximum usage</text>
  <rect x="265.6" y="148" width="48.2" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="321.8" y="163" font-size="14" fill="#a3a4b8">0.41</text>
  <text x="253.6" y="199" text-anchor="end" font-size="14" fill="#ececf2">Kernel proof ceiling</text>
  <rect x="265.6" y="184" width="31.5" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="305.1" y="199" font-size="14" fill="#a3a4b8">0.268</text>
  <text x="559.8" y="264" text-anchor="middle" font-size="14" fill="#a3a4b8">Memory (GB)</text>
</svg>
