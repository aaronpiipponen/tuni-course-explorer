<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 268" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Matched bounded read: peak and recorded growth</title>
  <desc id="d">Process peak and largest recorded sample growth for the materialized and bounded legs of the matched basis-50 read.</desc>
  <rect width="960" height="268" rx="12" fill="#232434"/>
  <rect x="61" y="33" width="14" height="14" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="96" y="45" font-size="14" fill="#a3a4b8">Process peak</text>
  <rect x="233.8" y="33" width="14" height="14" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="268.8" y="45" font-size="14" fill="#a3a4b8">Largest recorded growth</text>
  <line x1="198.4" y1="72" x2="198.4" y2="192" stroke="#a3a4b8" stroke-width="1"/>
  <text x="198.4" y="214" text-anchor="middle" font-size="14" fill="#a3a4b8">0</text>
  <line x1="416.9" y1="72" x2="416.9" y2="192" stroke="#4a4c6b" stroke-width="1"/>
  <text x="416.9" y="214" text-anchor="middle" font-size="14" fill="#a3a4b8">200</text>
  <line x1="635.5" y1="72" x2="635.5" y2="192" stroke="#4a4c6b" stroke-width="1"/>
  <text x="635.5" y="214" text-anchor="middle" font-size="14" fill="#a3a4b8">400</text>
  <line x1="854" y1="72" x2="854" y2="192" stroke="#4a4c6b" stroke-width="1"/>
  <text x="854" y="214" text-anchor="middle" font-size="14" fill="#a3a4b8">600</text>
  <text x="186.4" y="107" text-anchor="end" font-size="14" fill="#ececf2">Materialized leg</text>
  <rect x="198.4" y="80" width="597.6" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="804" y="95" font-size="14" fill="#a3a4b8">546.9</text>
  <rect x="198.4" y="104" width="288.1" height="20" rx="2" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="494.5" y="119" font-size="14" fill="#a3a4b8">263.7</text>
  <text x="186.4" y="167" text-anchor="end" font-size="14" fill="#ececf2">Bounded leg</text>
  <rect x="198.4" y="140" width="187.4" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="393.8" y="155" font-size="14" fill="#a3a4b8">171.5</text>
  <rect x="198.4" y="164" width="11.8" height="20" rx="2" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="218.2" y="179" font-size="14" fill="#a3a4b8">10.8</text>
  <text x="526.2" y="244" text-anchor="middle" font-size="14" fill="#a3a4b8">Memory (MB)</text>
</svg>
