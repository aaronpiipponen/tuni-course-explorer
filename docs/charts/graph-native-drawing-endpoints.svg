  <title id="t">Drawing endpoint core-seconds before the port and in the final product</title>
  <desc id="d">Mean core-seconds of three samples for the five drawing targets, ordered by piece count. Every target is faster in the final product, and the zero-piece target falls from 0.1388 to 0.0185 core-seconds.</desc>
