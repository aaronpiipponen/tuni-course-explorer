  <rect x="200.2" y="33" width="14" height="14" fill="#35d9f1" stroke="none" stroke-width="1.5"/>
  <text x="235.2" y="45" font-size="14" fill="#a3a4b8">Final product</text>
  <line x1="148" y1="72" x2="148" y2="372" stroke="#a3a4b8" stroke-width="1"/>
  <text x="148" y="394" text-anchor="middle" font-size="14" fill="#a3a4b8">0</text>
  <line x1="287.5" y1="72" x2="287.5" y2="372" stroke="#4a4c6b" stroke-width="1"/>
  <text x="287.5" y="394" text-anchor="middle" font-size="14" fill="#a3a4b8">0.1</text>
