  <text x="566.6" y="394" text-anchor="middle" font-size="14" fill="#a3a4b8">0.3</text>
  <line x1="706.1" y1="72" x2="706.1" y2="372" stroke="#4a4c6b" stroke-width="1"/>
  <text x="706.1" y="394" text-anchor="middle" font-size="14" fill="#a3a4b8">0.4</text>
  <line x1="845.6" y1="72" x2="845.6" y2="372" stroke="#4a4c6b" stroke-width="1"/>
  <text x="845.6" y="394" text-anchor="middle" font-size="14" fill="#a3a4b8">0.5</text>
