<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 216" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Largest projection time across the corrected passes</title>
  <desc id="d">The largest project stage across all 110 cases in each corrected pass. The first correction reached 15,706.5 ms, and the second and module-drawing passes stayed near 600 ms.</desc>
  <rect width="960" height="216" rx="12" fill="#232434"/>
  <line x1="206.8" y1="32" x2="206.8" y2="140" stroke="#a3a4b8" stroke-width="1"/>
  <text x="206.8" y="162" text-anchor="middle" font-size="14" fill="#a3a4b8">0</text>
  <line x1="362.3" y1="32" x2="362.3" y2="140" stroke="#4a4c6b" stroke-width="1"/>
  <text x="362.3" y="162" text-anchor="middle" font-size="14" fill="#a3a4b8">5,000</text>
  <line x1="517.8" y1="32" x2="517.8" y2="140" stroke="#4a4c6b" stroke-width="1"/>
  <text x="517.8" y="162" text-anchor="middle" font-size="14" fill="#a3a4b8">10,000</text>
  <line x1="673.3" y1="32" x2="673.3" y2="140" stroke="#4a4c6b" stroke-width="1"/>
  <text x="673.3" y="162" text-anchor="middle" font-size="14" fill="#a3a4b8">15,000</text>
  <line x1="828.8" y1="32" x2="828.8" y2="140" stroke="#4a4c6b" stroke-width="1"/>
  <text x="828.8" y="162" text-anchor="middle" font-size="14" fill="#a3a4b8">20,000</text>
  <text x="194.8" y="55" text-anchor="end" font-size="14" fill="#ececf2">First correction</text>
  <rect x="206.8" y="40" width="488.5" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="703.3" y="55" font-size="14" fill="#a3a4b8">15,706.5</text>
  <text x="194.8" y="91" text-anchor="end" font-size="14" fill="#ececf2">Second correction</text>
  <rect x="206.8" y="76" width="18.5" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="233.3" y="91" font-size="14" fill="#a3a4b8">593.5</text>
  <text x="194.8" y="127" text-anchor="end" font-size="14" fill="#ececf2">Module drawing</text>
  <rect x="206.8" y="112" width="18.7" height="20" rx="2" fill="#c4a0ff" stroke="none" stroke-width="1.5"/>
  <text x="233.5" y="127" font-size="14" fill="#a3a4b8">600.5</text>
  <text x="517.8" y="192" text-anchor="middle" font-size="14" fill="#a3a4b8">Projection time (ms)</text>
</svg>
