<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Stage lifecycle states</title>
  <desc id="d">One stage moves from idle to starting, and its worker reports running. A status read
  projects the interrupted state while a starting or running stage has no live owned process. The
  run ends at a durable boundary as completed, failed, paused or stopped, a resume returns a paused
  stage to starting, and a stop action from any non-idle state finalizes the session and publishes
  idle.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a98ae0"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="12" fill="#232434"/>

  <rect x="48" y="40" width="200" height="64" rx="8" fill="#2e3045" stroke="#a98ae0" stroke-width="1.5"/>
  <text x="148" y="66" text-anchor="middle" font-size="16" fill="#ececf2">Stop action</text>
  <text x="148" y="88" text-anchor="middle" font-size="14" fill="#a3a4b8">Any non-idle state</text>

  <rect x="296" y="40" width="200" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="396" y="66" text-anchor="middle" font-size="16" fill="#ececf2">Idle</text>
  <text x="396" y="88" text-anchor="middle" font-size="14" fill="#a3a4b8">No current run</text>

  <rect x="544" y="40" width="200" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="644" y="66" text-anchor="middle" font-size="16" fill="#ececf2">Starting</text>
  <text x="644" y="88" text-anchor="middle" font-size="14" fill="#a3a4b8">Start claimed it</text>

  <rect x="752" y="152" width="160" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="832" y="178" text-anchor="middle" font-size="16" fill="#ececf2">Interrupted</text>
  <text x="832" y="200" text-anchor="middle" font-size="14" fill="#a3a4b8">Not recorded</text>

  <rect x="112" y="264" width="736" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="290" text-anchor="middle" font-size="16" fill="#ececf2">Running</text>
  <text x="480" y="312" text-anchor="middle" font-size="14" fill="#a3a4b8">The worker works</text>

  <rect x="48" y="376" width="180" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="138" y="402" text-anchor="middle" font-size="16" fill="#ececf2">Paused</text>
  <text x="138" y="424" text-anchor="middle" font-size="14" fill="#a3a4b8">Pause took effect</text>

  <rect x="276" y="376" width="180" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="366" y="402" text-anchor="middle" font-size="16" fill="#ececf2">Failed</text>
  <text x="366" y="424" text-anchor="middle" font-size="14" fill="#a3a4b8">An error ended it</text>

  <rect x="504" y="376" width="180" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="594" y="402" text-anchor="middle" font-size="16" fill="#ececf2">Stopped</text>
  <text x="594" y="424" text-anchor="middle" font-size="14" fill="#a3a4b8">Stop took effect</text>

  <rect x="732" y="376" width="180" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="822" y="402" text-anchor="middle" font-size="16" fill="#ececf2">Completed</text>
  <text x="822" y="424" text-anchor="middle" font-size="14" fill="#a3a4b8">The work finished</text>

  <line x1="248" y1="72" x2="296" y2="72" stroke="#a98ae0" stroke-width="1.5"
        marker-end="url(#arrow-accent)"/>
  <text x="252" y="60" font-size="14" fill="#a3a4b8">stop</text>

  <line x1="496" y1="72" x2="544" y2="72" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="500" y="60" font-size="14" fill="#a3a4b8">start</text>

  <line x1="604" y1="104" x2="604" y2="264" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="612" y="136" font-size="14" fill="#a3a4b8">worker reports running</text>

  <polyline points="744,72 832,72 832,152" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <line x1="800" y1="264" x2="800" y2="216" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <line x1="138" y1="328" x2="138" y2="376" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="366" y1="328" x2="366" y2="376" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="594" y1="328" x2="594" y2="376" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="822" y1="328" x2="822" y2="376" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polyline points="100,376 100,128 560,128 560,104" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="152" font-size="14" fill="#a3a4b8">resume</text>

  <rect x="48" y="480" width="340" height="48" rx="8" fill="none" stroke="#4a4c6b" stroke-width="1.5"/>
  <line x1="64" y1="504" x2="104" y2="504" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="116" y="509" font-size="14" fill="#a3a4b8">Projected by a status read</text>
</svg>
