<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 672" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Stage lifecycle states</title>
  <desc id="d">One stage moves from idle through starting to running. The run then ends at a durable
  boundary as completed, failed, paused, or stopped, and a stop finalizes any of those states to idle.
  The frame marks the durable boundaries a run can end at.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a98ae0"/>
    </marker>
  </defs>
  <rect width="960" height="672" rx="12" fill="#232434"/>

  <rect x="56" y="88" width="190" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="151" y="114" text-anchor="middle" font-size="16" fill="#ececf2">Idle</text>
  <text x="151" y="136" text-anchor="middle" font-size="14" fill="#a3a4b8">No current run</text>

  <rect x="310" y="88" width="190" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="405" y="114" text-anchor="middle" font-size="16" fill="#ececf2">Starting</text>
  <text x="405" y="136" text-anchor="middle" font-size="14" fill="#a3a4b8">Start claimed it</text>

  <rect x="748" y="88" width="188" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="842" y="114" text-anchor="middle" font-size="16" fill="#ececf2">Running</text>
  <text x="842" y="136" text-anchor="middle" font-size="14" fill="#a3a4b8">The worker works</text>

  <rect x="490" y="208" width="380" height="432" rx="12" fill="none" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="514" y="240" font-size="16" fill="#a3a4b8">The run ends at a durable boundary</text>

  <rect x="514" y="272" width="332" height="60" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="680" y="298" text-anchor="middle" font-size="16" fill="#ececf2">Completed</text>
  <text x="680" y="320" text-anchor="middle" font-size="14" fill="#a3a4b8">The work finished</text>

  <rect x="514" y="364" width="332" height="60" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="680" y="390" text-anchor="middle" font-size="16" fill="#ececf2">Failed</text>
  <text x="680" y="412" text-anchor="middle" font-size="14" fill="#a3a4b8">The run ended with an error</text>

  <rect x="514" y="456" width="332" height="60" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="680" y="482" text-anchor="middle" font-size="16" fill="#ececf2">Paused</text>
  <text x="680" y="504" text-anchor="middle" font-size="14" fill="#a3a4b8">A pause took effect</text>

  <rect x="514" y="548" width="332" height="60" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="680" y="574" text-anchor="middle" font-size="16" fill="#ececf2">Stopped</text>
  <text x="680" y="596" text-anchor="middle" font-size="14" fill="#a3a4b8">A stop took effect</text>

  <line x1="246" y1="120" x2="310" y2="120" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="500" y1="120" x2="748" y2="120" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <polyline points="842,152 842,180 680,180 680,208" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>

  <polyline points="490,424 32,424 32,120 56,120" fill="none" stroke="#a98ae0"
            stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <text x="257" y="109" font-size="14" fill="#a3a4b8">start</text>
  <text x="508" y="109" font-size="14" fill="#a3a4b8">the worker reports running</text>
  <text x="215" y="413" font-size="14" fill="#a3a4b8">stop finalizes</text>
</svg>
