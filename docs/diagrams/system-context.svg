  <text x="310" y="424" font-size="14" fill="#a3a4b8">Published data</text>

  <polyline points="162,600 162,632 462,632 462,600" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="174" y="620" font-size="14" fill="#a3a4b8">Working copy out and back</text>

  <line x1="700" y1="400" x2="700" y2="328" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="712" y="376" font-size="14" fill="#a3a4b8">Claims and records</text>
</svg>
