        marker-end="url(#arrow)"/>
  <text x="606" y="104" font-size="14" fill="#a3a4b8">Embeds query text</text>

  <polyline points="584,160 632,160 632,296 648,296" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="220" font-size="14" fill="#a3a4b8">Writes submissions</text>

  <polyline points="462,176 462,224 616,224 616,544 648,544" fill="none" stroke="#a3a4b8"
