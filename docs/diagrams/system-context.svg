<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">System context of course-explorer</title>
  <desc id="d">The browser app and the web server, outlined in accent as the read-only side, answer the
  request path, which reads the Selected dataset from the PostgreSQL database with pgvector and
  embeds query text through the embedding service. The administration console and the administration
  backend form the administration surface, and the backend runs fixed commands through the
  administration command. The administration command and the worker form the preparation path, which
  captures the public curriculum source and fills the Working dataset, with the translation and
  inference stages running on the worker's copy. The feedback application store holds the submissions
  the web server writes, and the feedback sender claims and records them.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="680" rx="12" fill="#232434"/>

  <rect x="24" y="64" width="576" height="152" rx="12" fill="none"
        stroke="#a98ae0" stroke-width="1.5"/>
  <text x="40" y="88" font-size="16" fill="#a98ae0">Read-only side</text>

  <rect x="24" y="232" width="576" height="120" rx="12" fill="none"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="40" y="256" font-size="16" fill="#a3a4b8">Administration surface</text>

  <rect x="24" y="368" width="576" height="280" rx="12" fill="none"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="40" y="392" font-size="16" fill="#a3a4b8">Preparation path</text>

  <rect x="40" y="112" width="244" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="162" y="138" text-anchor="middle" font-size="16" fill="#ececf2">Browser app</text>
  <text x="162" y="160" text-anchor="middle" font-size="14" fill="#a3a4b8">Browser state</text>

  <rect x="340" y="112" width="244" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="462" y="138" text-anchor="middle" font-size="16" fill="#ececf2">Web server</text>
  <text x="462" y="160" text-anchor="middle" font-size="14" fill="#a3a4b8">Read-only API</text>

  <rect x="40" y="264" width="244" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="162" y="290" text-anchor="middle" font-size="16" fill="#ececf2">Administration console</text>
  <text x="162" y="312" text-anchor="middle" font-size="14" fill="#a3a4b8">Signed-in browser app</text>

  <rect x="340" y="264" width="244" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="462" y="290" text-anchor="middle" font-size="16" fill="#ececf2">Administration backend</text>
  <text x="462" y="312" text-anchor="middle" font-size="14" fill="#a3a4b8">Commands and sessions</text>

  <rect x="40" y="400" width="244" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="162" y="426" text-anchor="middle" font-size="16" fill="#ececf2">Curriculum source</text>
  <text x="162" y="448" text-anchor="middle" font-size="14" fill="#a3a4b8">Public course data</text>

  <rect x="340" y="536" width="244" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="462" y="562" text-anchor="middle" font-size="16" fill="#ececf2">Administration command</text>
  <text x="462" y="584" text-anchor="middle" font-size="14" fill="#a3a4b8">Operator menu and stages</text>

  <rect x="40" y="536" width="244" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="162" y="562" text-anchor="middle" font-size="16" fill="#ececf2">Worker</text>
  <text x="162" y="584" text-anchor="middle" font-size="14" fill="#a3a4b8">Translation and inference</text>

  <rect x="648" y="112" width="288" height="64" rx="8"
