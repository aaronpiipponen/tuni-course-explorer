<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 712" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Administration admission order</title>
  <desc id="d">Every HTTP request passes the administration lock, the exact site, the shell and
  asset exception, the session requirement and the CSRF check in this order. The lock, a site
  mismatch, a sign-in without a live session and a missing or wrong CSRF token answer an empty 403,
  a protected address without an authenticated session answers an empty 401, and a fresh anonymous
  session beyond the creation limit answers an empty 429.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a98ae0"/>
    </marker>
  </defs>
  <rect width="960" height="712" rx="12" fill="#232434"/>

  <rect x="64" y="40" width="320" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="224" y="66" text-anchor="middle" font-size="16" fill="#ececf2">Request</text>
  <text x="224" y="88" text-anchor="middle" font-size="14" fill="#a3a4b8">Every HTTP request</text>

  <rect x="64" y="136" width="320" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="224" y="162" text-anchor="middle" font-size="16" fill="#ececf2">Administration lock</text>
  <text x="224" y="184" text-anchor="middle" font-size="14" fill="#a3a4b8">The lock file exists</text>

  <rect x="64" y="232" width="320" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="224" y="258" text-anchor="middle" font-size="16" fill="#ececf2">Exact site</text>
  <text x="224" y="280" text-anchor="middle" font-size="14" fill="#a3a4b8">Host and Origin</text>

  <rect x="64" y="328" width="320" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="224" y="354" text-anchor="middle" font-size="16" fill="#ececf2">Built shell or asset</text>
  <text x="224" y="376" text-anchor="middle" font-size="14" fill="#a3a4b8">GET or HEAD only</text>

  <rect x="64" y="424" width="320" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="224" y="450" text-anchor="middle" font-size="16" fill="#ececf2">Session</text>
  <text x="224" y="472" text-anchor="middle" font-size="14" fill="#a3a4b8">Reuse, creation or authentication</text>

  <rect x="64" y="520" width="320" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="224" y="546" text-anchor="middle" font-size="16" fill="#ececf2">CSRF token</text>
  <text x="224" y="568" text-anchor="middle" font-size="14" fill="#a3a4b8">State-changing method</text>

  <rect x="64" y="616" width="320" height="64" rx="8" fill="#2e3045"
        stroke="#a98ae0" stroke-width="1.5"/>
  <text x="224" y="642" text-anchor="middle" font-size="16" fill="#ececf2">Admitted</text>
  <text x="224" y="664" text-anchor="middle" font-size="14" fill="#a3a4b8">Session idle clock refreshed</text>

  <rect x="576" y="136" width="320" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="736" y="162" text-anchor="middle" font-size="16" fill="#ececf2">403 with an empty body</text>
  <text x="736" y="184" text-anchor="middle" font-size="14" fill="#a3a4b8">Every address refused</text>

  <rect x="576" y="232" width="320" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="736" y="258" text-anchor="middle" font-size="16" fill="#ececf2">403 with an empty body</text>
  <text x="736" y="280" text-anchor="middle" font-size="14" fill="#a3a4b8">Host or origin differs</text>

  <rect x="576" y="328" width="320" height="64" rx="8" fill="#2e3045"
        stroke="#a98ae0" stroke-width="1.5"/>
  <text x="736" y="354" text-anchor="middle" font-size="16" fill="#ececf2">Admitted without a session</text>
  <text x="736" y="376" text-anchor="middle" font-size="14" fill="#a3a4b8">No command and no record</text>

  <rect x="576" y="408" width="320" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="736" y="434" text-anchor="middle" font-size="16" fill="#ececf2">401 or 429, empty body</text>
  <text x="736" y="456" text-anchor="middle" font-size="14" fill="#a3a4b8">Missing session or creation limit</text>

  <rect x="576" y="504" width="320" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="736" y="530" text-anchor="middle" font-size="16" fill="#ececf2">403 with an empty body</text>
  <text x="736" y="552" text-anchor="middle" font-size="14" fill="#a3a4b8">Login without a session</text>

  <rect x="576" y="600" width="320" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="736" y="626" text-anchor="middle" font-size="16" fill="#ececf2">403 with an empty body</text>
  <text x="736" y="648" text-anchor="middle" font-size="14" fill="#a3a4b8">Missing or wrong token</text>

  <line x1="224" y1="104" x2="224" y2="136" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="224" y1="200" x2="224" y2="232" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="224" y1="296" x2="224" y2="328" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="224" y1="392" x2="224" y2="424" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="224" y1="488" x2="224" y2="520" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="224" y1="584" x2="224" y2="616" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <line x1="384" y1="168" x2="576" y2="168" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="480" y="158" text-anchor="middle" font-size="14" fill="#a3a4b8">lock exists</text>

  <line x1="384" y1="264" x2="576" y2="264" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="480" y="254" text-anchor="middle" font-size="14" fill="#a3a4b8">mismatch</text>

  <line x1="384" y1="360" x2="576" y2="360" stroke="#a98ae0" stroke-width="1.5"
        marker-end="url(#arrow-accent)"/>
  <text x="480" y="350" text-anchor="middle" font-size="14" fill="#a3a4b8">GET or HEAD</text>

  <line x1="384" y1="440" x2="576" y2="440" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="480" y="430" text-anchor="middle" font-size="14" fill="#a3a4b8">session refused</text>

  <polyline points="384,472 520,472 520,536 576,536" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="490" text-anchor="middle" font-size="14" fill="#a3a4b8">login</text>

  <polyline points="384,552 540,552 540,632 576,632" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="460" y="540" text-anchor="middle" font-size="14" fill="#a3a4b8">no match</text>
</svg>
