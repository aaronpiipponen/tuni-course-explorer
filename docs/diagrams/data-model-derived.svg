  <text x="414" y="562" text-anchor="end" font-size="14" fill="#a3a4b8">1</text>
  <text x="428" y="574" font-size="14" fill="#a3a4b8">N</text>

  <polyline points="552,606 570,606 570,474 640,474" fill="none" stroke="#a98ae0"
