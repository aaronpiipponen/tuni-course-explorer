<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Derived data model</title>
  <desc id="d">A canonical course holds one inferred prerequisite set, one equivalence membership
  among the members of an inferred equivalence group, one processing marker, and the checkpoints of
  a processing cycle. The marker and each checkpoint hold a proposal pointer, drawn dashed. The
  generation chain runs from a pipeline run through target work and a model attempt to a proposal,
  and a checkpoint holds one failure summary per failed episode. Each entity lists its identity and
  key columns.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a98ae0"/>
    </marker>
  </defs>
  <rect width="960" height="700" rx="12" fill="#232434"/>

  <rect x="48" y="300" width="136" height="116" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="116" y="324" text-anchor="middle" font-size="16" fill="#ececf2">Course</text>
  <text x="116" y="351" text-anchor="middle" font-size="15" fill="#a3a4b8">id</text>
  <text x="116" y="375" text-anchor="middle" font-size="15" fill="#a3a4b8">group_id</text>

  <rect x="288" y="48" width="264" height="84" rx="8" fill="#2e3045" stroke="#4a4c6b"
