<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Derived data model</title>
  <desc id="d">A canonical course holds one inferred prerequisite set, one equivalence membership
  among the members of an inferred equivalence group, and one processing marker. The marker and the
  per-target checkpoint of a processing cycle each hold a proposal pointer, drawn dashed. The
  generation chain runs from a pipeline run through target work and a model attempt to a proposal,
  and a checkpoint holds one failure summary per failed episode.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a98ae0"/>
    </marker>
  </defs>
  <rect width="960" height="640" rx="12" fill="#232434"/>

  <rect x="40" y="264" width="140" height="112" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="110" y="326" text-anchor="middle" font-size="15" fill="#ececf2">Course</text>

  <rect x="300" y="40" width="280" height="52" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="440" y="71" text-anchor="middle" font-size="15" fill="#ececf2">InferredPrerequisiteSet</text>

  <rect x="300" y="150" width="280" height="52" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="440" y="181" text-anchor="middle" font-size="15" fill="#ececf2">InferredEquivalenceGroup</text>

  <rect x="300" y="256" width="280" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="440" y="282" text-anchor="middle" font-size="15" fill="#ececf2">InferredEquivalence</text>
  <text x="440" y="304" text-anchor="middle" font-size="15" fill="#ececf2">GroupMember</text>

  <rect x="300" y="380" width="280" height="52" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="440" y="411" text-anchor="middle" font-size="15" fill="#ececf2">InferenceCourseProcessing</text>

  <rect x="300" y="500" width="280" height="52" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="440" y="531" text-anchor="middle" font-size="15" fill="#ececf2">InferenceProcessingCycle</text>

  <rect x="676" y="40" width="260" height="52" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="806" y="71" text-anchor="middle" font-size="15" fill="#ececf2">InferencePipelineRun</text>

  <rect x="676" y="136" width="260" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="806" y="162" text-anchor="middle" font-size="15" fill="#ececf2">InferenceTargetWork</text>
  <text x="806" y="184" text-anchor="middle" font-size="14" fill="#a3a4b8">per target and work key</text>

  <rect x="676" y="244" width="260" height="52" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="806" y="275" text-anchor="middle" font-size="15" fill="#ececf2">InferenceModelAttempt</text>

  <rect x="676" y="340" width="260" height="52" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="806" y="371" text-anchor="middle" font-size="15" fill="#ececf2">InferenceProposal</text>

  <rect x="676" y="436" width="260" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="806" y="462" text-anchor="middle" font-size="15" fill="#ececf2">InferenceProcessingTarget</text>
  <text x="806" y="484" text-anchor="middle" font-size="14" fill="#a3a4b8">checkpoint per target</text>

  <rect x="676" y="544" width="260" height="52" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="806" y="575" text-anchor="middle" font-size="15" fill="#ececf2">InferenceTargetFailure</text>

  <polyline points="180,288 220,288 220,66 300,66" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="186" y="280" font-size="14" fill="#a3a4b8">1</text>
  <text x="294" y="58" text-anchor="end" font-size="14" fill="#a3a4b8">1</text>

  <polyline points="180,320 240,320 240,288 300,288" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="186" y="312" font-size="14" fill="#a3a4b8">1</text>
  <text x="294" y="280" text-anchor="end" font-size="14" fill="#a3a4b8">N</text>

  <polyline points="180,352 260,352 260,406 300,406" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="186" y="344" font-size="14" fill="#a3a4b8">1</text>
  <text x="294" y="398" text-anchor="end" font-size="14" fill="#a3a4b8">1</text>

  <line x1="440" y1="202" x2="440" y2="256" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="450" y="220" font-size="14" fill="#a3a4b8">1</text>
  <text x="450" y="246" font-size="14" fill="#a3a4b8">N</text>

  <polyline points="580,406 630,406 630,366 676,366" fill="none" stroke="#a98ae0"
            stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-accent)"/>
  <text x="586" y="398" font-size="14" fill="#a3a4b8">N</text>
  <text x="670" y="358" text-anchor="end" font-size="14" fill="#a3a4b8">1</text>

  <polyline points="580,526 640,526 640,468 676,468" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="586" y="518" font-size="14" fill="#a3a4b8">1</text>
  <text x="670" y="460" text-anchor="end" font-size="14" fill="#a3a4b8">N</text>

  <line x1="806" y1="92" x2="806" y2="136" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="816" y="110" font-size="14" fill="#a3a4b8">1</text>
  <text x="816" y="130" font-size="14" fill="#a3a4b8">N</text>

  <line x1="806" y1="200" x2="806" y2="244" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="816" y="218" font-size="14" fill="#a3a4b8">1</text>
  <text x="816" y="238" font-size="14" fill="#a3a4b8">N</text>

  <line x1="806" y1="296" x2="806" y2="340" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="816" y="314" font-size="14" fill="#a3a4b8">1</text>
  <text x="816" y="334" font-size="14" fill="#a3a4b8">N</text>

  <line x1="806" y1="436" x2="806" y2="392" stroke="#a98ae0" stroke-width="1.5"
        stroke-dasharray="6 4" marker-end="url(#arrow-accent)"/>
  <text x="816" y="406" font-size="14" fill="#a3a4b8">1</text>
  <text x="816" y="428" font-size="14" fill="#a3a4b8">N</text>

  <line x1="806" y1="500" x2="806" y2="544" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="816" y="518" font-size="14" fill="#a3a4b8">1</text>
  <text x="816" y="538" font-size="14" fill="#a3a4b8">N</text>

  <rect x="40" y="560" width="220" height="48" rx="8" fill="none" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <line x1="56" y1="584" x2="96" y2="584" stroke="#a98ae0" stroke-width="1.5"
        stroke-dasharray="6 4" marker-end="url(#arrow-accent)"/>
  <text x="108" y="589" font-size="14" fill="#a3a4b8">Proposal pointer</text>
</svg>
