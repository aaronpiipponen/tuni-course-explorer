<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Route parity comparison setup</title>
  <desc id="d">One scenario from the selected dataset is prepared once with its solver structure,
  basis and drawing. The Python calculation reads it in process, and the TypeScript solver reads it
  through Node with one subprocess per call. Both route results and box states are compared field
  by field, and all 506 compared scenarios were equal.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="12" fill="#232434"/>

  <rect x="380" y="40" width="200" height="40" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="66" text-anchor="middle" font-size="16" fill="#ececf2">Selected dataset</text>

  <rect x="260" y="112" width="440" height="64" rx="8" fill="#2e3045"
        stroke="#a98ae0" stroke-width="1.5"/>
  <text x="480" y="138" text-anchor="middle" font-size="16" fill="#ececf2">One prepared scenario</text>
  <text x="480" y="160" text-anchor="middle" font-size="14" fill="#a3a4b8">solver structure, basis and drawing projection</text>

  <rect x="48" y="232" width="380" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="238" y="258" text-anchor="middle" font-size="16" fill="#ececf2">Python calculation</text>
  <text x="238" y="280" text-anchor="middle" font-size="14" fill="#a3a4b8">route and box states in process</text>

  <rect x="532" y="232" width="380" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="722" y="258" text-anchor="middle" font-size="16" fill="#ececf2">TypeScript solver through Node</text>
  <text x="722" y="280" text-anchor="middle" font-size="14" fill="#a3a4b8">one subprocess per call</text>

  <rect x="260" y="344" width="440" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="370" text-anchor="middle" font-size="16" fill="#ececf2">Field-by-field comparison</text>
  <text x="480" y="392" text-anchor="middle" font-size="14" fill="#a3a4b8">route fields and four box-state flags</text>

  <rect x="260" y="440" width="440" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="466" text-anchor="middle" font-size="16" fill="#ececf2">Equal on every compared field</text>
  <text x="480" y="488" text-anchor="middle" font-size="14" fill="#a3a4b8">506 of 510 scenarios compared</text>

  <line x1="480" y1="80" x2="480" y2="112" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="480" y1="176" x2="480" y2="208" stroke="#a3a4b8" stroke-width="1.5"/>
  <line x1="238" y1="208" x2="722" y2="208" stroke="#a3a4b8" stroke-width="1.5"/>
  <line x1="238" y1="208" x2="238" y2="232" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="722" y1="208" x2="722" y2="232" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="238" y1="296" x2="238" y2="320" stroke="#a3a4b8" stroke-width="1.5"/>
  <line x1="722" y1="296" x2="722" y2="320" stroke="#a3a4b8" stroke-width="1.5"/>
  <line x1="238" y1="320" x2="722" y2="320" stroke="#a3a4b8" stroke-width="1.5"/>
  <line x1="480" y1="320" x2="480" y2="344" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="480" y1="408" x2="480" y2="440" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
</svg>
