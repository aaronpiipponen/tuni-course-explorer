<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 536" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Prerequisite graph report and local route calculation</title>
  <desc id="d">The live profile inputs supply the graph read's structural subset, and the read returns one
  graph report carrying the solver structure, the serving dataset identity and the configured allocation
  limit. The graph report feeds the solver structure to the browser worker and draws the graph. A
  successful route is stored in the shared read cache and becomes the route result, and the route result
  lights the drawing and fills the route panel. The cache returns a held route to the route result without
  a worker.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="536" rx="12" fill="#232434"/>

  <rect x="48" y="80" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="168" y="106" text-anchor="middle" font-size="16" fill="#ececf2">Profile inputs</text>
  <text x="168" y="128" text-anchor="middle" font-size="14" fill="#a3a4b8">live course state</text>

  <rect x="360" y="80" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="106" text-anchor="middle" font-size="16" fill="#ececf2">Graph read</text>
  <text x="480" y="128" text-anchor="middle" font-size="14" fill="#a3a4b8">structural subset</text>

  <rect x="672" y="80" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="792" y="106" text-anchor="middle" font-size="16" fill="#ececf2">Graph report</text>
  <text x="792" y="128" text-anchor="middle" font-size="14" fill="#a3a4b8">structure and limit</text>

  <rect x="48" y="200" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#a98ae0" stroke-width="1.5"/>
  <text x="168" y="226" text-anchor="middle" font-size="16" fill="#ececf2">Browser worker</text>
  <text x="168" y="248" text-anchor="middle" font-size="14" fill="#a3a4b8">one explicit click</text>

  <rect x="360" y="200" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="480" y="226" text-anchor="middle" font-size="16" fill="#ececf2">Shared read cache</text>
  <text x="480" y="248" text-anchor="middle" font-size="14" fill="#a3a4b8">graph and route values</text>

  <rect x="672" y="200" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="792" y="226" text-anchor="middle" font-size="16" fill="#ececf2">Draw the graph</text>
  <text x="792" y="248" text-anchor="middle" font-size="14" fill="#a3a4b8">boxes and the route</text>

  <rect x="360" y="320" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="480" y="346" text-anchor="middle" font-size="16" fill="#ececf2">Route result</text>
  <text x="480" y="368" text-anchor="middle" font-size="14" fill="#a3a4b8">one route outcome</text>

  <rect x="672" y="320" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="792" y="346" text-anchor="middle" font-size="16" fill="#ececf2">Route panel</text>
  <text x="792" y="368" text-anchor="middle" font-size="14" fill="#a3a4b8">rows and outcome</text>

  <line x1="288" y1="112" x2="360" y2="112" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <line x1="600" y1="112" x2="672" y2="112" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <line x1="168" y1="144" x2="168" y2="200" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <polyline points="700,144 700,164 210,164 210,200" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="188" font-size="14" fill="#a3a4b8">solver structure</text>

  <polyline points="760,144 760,184 480,184 480,200" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="708" y="172" font-size="14" fill="#a3a4b8">store</text>

  <line x1="792" y1="144" x2="792" y2="200" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <polyline points="288,232 324,232 324,352 360,352" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="440" y1="264" x2="440" y2="320" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="450" y="296" font-size="14" fill="#a3a4b8">cached route</text>

  <line x1="560" y1="320" x2="560" y2="264" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="572" y="296" font-size="14" fill="#a3a4b8">store</text>

  <polyline points="600,328 636,328 636,232 672,232" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="646" y="300" font-size="14" fill="#a3a4b8">lights the drawing</text>

  <line x1="600" y1="360" x2="672" y2="360" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <rect x="48" y="440" width="260" height="52" rx="8" fill="none" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <line x1="64" y1="466" x2="104" y2="466" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4"/>
  <text x="116" y="471" font-size="14" fill="#a3a4b8">Held or stored value</text>
</svg>
