<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 488" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Prerequisite graph report and local route calculation</title>
  <desc id="d">The live profile inputs supply the graph read's structural subset, and the read returns one
  graph report carrying the solver structure, the serving dataset identity and the configured allocation
  limit. The graph report feeds the solver structure to the browser worker and draws the graph. A
  successful route is stored in the shared read cache and becomes the route result, and the route result
  lights the drawing and fills the route panel. The cache returns a held route to the route result without
  a worker.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="488" rx="12" fill="#232434"/>

  <rect x="48" y="48" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="168" y="74" text-anchor="middle" font-size="16" fill="#ececf2">Profile inputs</text>
  <text x="168" y="96" text-anchor="middle" font-size="14" fill="#a3a4b8">live course state</text>

  <rect x="346" y="48" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="466" y="74" text-anchor="middle" font-size="16" fill="#ececf2">Graph read</text>
  <text x="466" y="96" text-anchor="middle" font-size="14" fill="#a3a4b8">structural subset</text>

  <rect x="644" y="48" width="268" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="778" y="74" text-anchor="middle" font-size="16" fill="#ececf2">Graph report</text>
  <text x="778" y="96" text-anchor="middle" font-size="14" fill="#a3a4b8">structure, identity, limit</text>

  <rect x="48" y="168" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#a98ae0" stroke-width="1.5"/>
  <text x="168" y="194" text-anchor="middle" font-size="16" fill="#ececf2">Browser worker</text>
  <text x="168" y="216" text-anchor="middle" font-size="14" fill="#a3a4b8">one explicit click</text>

  <rect x="346" y="168" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="466" y="194" text-anchor="middle" font-size="16" fill="#ececf2">Read cache</text>
  <text x="466" y="216" text-anchor="middle" font-size="14" fill="#a3a4b8">graph and route values</text>

  <rect x="644" y="168" width="268" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="778" y="194" text-anchor="middle" font-size="16" fill="#ececf2">Draw the graph</text>
  <text x="778" y="216" text-anchor="middle" font-size="14" fill="#a3a4b8">boxes and the route</text>

  <rect x="346" y="288" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="466" y="314" text-anchor="middle" font-size="16" fill="#ececf2">Route result</text>
  <text x="466" y="336" text-anchor="middle" font-size="14" fill="#a3a4b8">one route outcome</text>

  <rect x="644" y="288" width="268" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="778" y="314" text-anchor="middle" font-size="16" fill="#ececf2">Route panel</text>
  <text x="778" y="336" text-anchor="middle" font-size="14" fill="#a3a4b8">rows and outcome</text>

  <line x1="288" y1="80" x2="346" y2="80" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <line x1="586" y1="80" x2="644" y2="80" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <line x1="168" y1="112" x2="168" y2="168" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="146" y="158" text-anchor="end" font-size="14" fill="#a3a4b8">live inputs</text>

  <polyline points="700,112 700,132 210,132 210,168" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="230" y="156" font-size="14" fill="#a3a4b8">solver structure</text>

  <polyline points="740,112 740,152 466,152 466,168" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="750" y="140" font-size="14" fill="#a3a4b8">store</text>

  <line x1="780" y1="112" x2="780" y2="168" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <polyline points="288,200 300,200 300,320 346,320" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="420" y1="232" x2="420" y2="288" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="408" y="264" text-anchor="end" font-size="14" fill="#a3a4b8">cached route</text>

  <line x1="510" y1="288" x2="510" y2="232" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="522" y="264" font-size="14" fill="#a3a4b8">store</text>

  <polyline points="586,304 614,304 614,200 644,200" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="626" y="250" font-size="14" fill="#a3a4b8">lights the drawing</text>

  <line x1="586" y1="336" x2="644" y2="336" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <rect x="48" y="408" width="260" height="48" rx="8" fill="none" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <line x1="64" y1="432" x2="104" y2="432" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="116" y="437" font-size="14" fill="#a3a4b8">Held or stored value</text>
</svg>
