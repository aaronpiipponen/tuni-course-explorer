<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 662" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Prerequisite expression for one graph root</title>
  <desc id="d">A graph root compiles to one composed AND that joins a required pool and a recommended
  pool. The required pool holds two options, an official AND of two courses and an inferred course
  drawn with a dashed outline. The recommended pool holds one official course.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="662" rx="12" fill="#232434"/>

  <rect x="388" y="40" width="184" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="66" text-anchor="middle" font-size="16" fill="#ececf2">Graph root</text>
  <text x="480" y="88" text-anchor="middle" font-size="14" fill="#a3a4b8">The opened course</text>

  <rect x="376" y="152" width="208" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="178" text-anchor="middle" font-size="16" fill="#ececf2">AND group</text>
  <text x="480" y="200" text-anchor="middle" font-size="14" fill="#a3a4b8">Joins the two pools</text>

  <rect x="204" y="264" width="192" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="300" y="290" text-anchor="middle" font-size="16" fill="#ececf2">Required pool</text>
  <text x="300" y="312" text-anchor="middle" font-size="14" fill="#a3a4b8">One OR of options</text>

  <rect x="592" y="264" width="196" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="690" y="290" text-anchor="middle" font-size="16" fill="#ececf2">Recommended pool</text>
  <text x="690" y="312" text-anchor="middle" font-size="14" fill="#a3a4b8">One OR of options</text>

  <rect x="80" y="376" width="192" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="176" y="402" text-anchor="middle" font-size="16" fill="#ececf2">Official option</text>
  <text x="176" y="424" text-anchor="middle" font-size="14" fill="#a3a4b8">AND of two courses</text>

  <rect x="400" y="376" width="120" height="64" rx="8" fill="#2e3045" stroke="#a98ae0"
        stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="460" y="402" text-anchor="middle" font-size="16" fill="#ececf2">Course C</text>
  <text x="460" y="424" text-anchor="middle" font-size="14" fill="#a3a4b8">Inferred</text>

  <rect x="630" y="376" width="120" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="690" y="402" text-anchor="middle" font-size="16" fill="#ececf2">Course D</text>
  <text x="690" y="424" text-anchor="middle" font-size="14" fill="#a3a4b8">Official</text>

  <rect x="32" y="488" width="120" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="92" y="514" text-anchor="middle" font-size="16" fill="#ececf2">Course A</text>
  <text x="92" y="536" text-anchor="middle" font-size="14" fill="#a3a4b8">Official</text>

  <rect x="200" y="488" width="120" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="260" y="514" text-anchor="middle" font-size="16" fill="#ececf2">Course B</text>
  <text x="260" y="536" text-anchor="middle" font-size="14" fill="#a3a4b8">Official</text>

  <polyline points="480,104 480,152" fill="none" stroke="#a3a4b8" stroke-width="1.5"
            marker-end="url(#arrow)"/>
  <polyline points="440,216 440,240 300,240 300,264" fill="none" stroke="#a3a4b8" stroke-width="1.5"
            marker-end="url(#arrow)"/>
  <polyline points="520,216 520,240 690,240 690,264" fill="none" stroke="#a3a4b8" stroke-width="1.5"
            marker-end="url(#arrow)"/>
  <polyline points="260,328 260,352 176,352 176,376" fill="none" stroke="#a3a4b8" stroke-width="1.5"
            marker-end="url(#arrow)"/>
  <polyline points="340,328 340,352 460,352 460,376" fill="none" stroke="#a3a4b8" stroke-width="1.5"
            marker-end="url(#arrow)"/>
  <polyline points="690,328 690,376" fill="none" stroke="#a3a4b8" stroke-width="1.5"
            marker-end="url(#arrow)"/>
  <polyline points="150,440 150,464 92,464 92,488" fill="none" stroke="#a3a4b8" stroke-width="1.5"
            marker-end="url(#arrow)"/>
  <polyline points="200,440 200,464 260,464 260,488" fill="none" stroke="#a3a4b8" stroke-width="1.5"
            marker-end="url(#arrow)"/>

  <rect x="32" y="584" width="196" height="46" rx="8" fill="none" stroke="#4a4c6b" stroke-width="1.5"/>
  <rect x="48" y="600" width="24" height="14" rx="8" fill="#2e3045" stroke="#a98ae0"
        stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="88" y="612" font-size="14" fill="#a3a4b8">Inferred option</text>
</svg>
