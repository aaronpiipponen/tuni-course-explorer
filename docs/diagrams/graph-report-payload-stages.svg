<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Graph report and route body measurement</title>
  <desc id="d">One case compiles the solver structure for one target and basis. The graph branch
  projects the drawing and serializes the graph report body. The route branch solves the route and
  serializes the route body. The accent marks the measured projection stage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="12" fill="#232434"/>

  <rect x="340" y="40" width="280" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="66" text-anchor="middle" font-size="16" fill="#ececf2">Compile solver structure</text>
  <text x="480" y="88" text-anchor="middle" font-size="14" fill="#a3a4b8">one target and basis</text>

  <rect x="80" y="144" width="260" height="64" rx="8" fill="#2e3045"
        stroke="#a98ae0" stroke-width="1.5"/>
  <text x="210" y="170" text-anchor="middle" font-size="16" fill="#ececf2">Project drawing</text>
  <text x="210" y="192" text-anchor="middle" font-size="14" fill="#a3a4b8">Python projector</text>

  <rect x="80" y="240" width="260" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="210" y="266" text-anchor="middle" font-size="16" fill="#ececf2">Serialize graph report</text>
  <text x="210" y="288" text-anchor="middle" font-size="14" fill="#a3a4b8">graph body raw and gzip</text>

  <rect x="620" y="144" width="260" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="750" y="170" text-anchor="middle" font-size="16" fill="#ececf2">Solve route</text>
  <text x="750" y="192" text-anchor="middle" font-size="14" fill="#a3a4b8">exact or greedy</text>

  <rect x="620" y="240" width="260" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="750" y="266" text-anchor="middle" font-size="16" fill="#ececf2">Serialize route</text>
  <text x="750" y="288" text-anchor="middle" font-size="14" fill="#a3a4b8">route body raw and gzip</text>

  <line x1="480" y1="104" x2="480" y2="120" stroke="#a3a4b8" stroke-width="1.5"/>
  <line x1="210" y1="120" x2="750" y2="120" stroke="#a3a4b8" stroke-width="1.5"/>
  <line x1="210" y1="120" x2="210" y2="144" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="750" y1="120" x2="750" y2="144" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="480" y="138" text-anchor="middle" font-size="14" fill="#a3a4b8">solver structure</text>

  <line x1="210" y1="208" x2="210" y2="240" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="750" y1="208" x2="750" y2="240" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <rect x="48" y="328" width="300" height="40" rx="8" fill="none" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <line x1="64" y1="348" x2="104" y2="348" stroke="#a98ae0" stroke-width="1.5"/>
  <text x="116" y="353" font-size="14" fill="#a3a4b8">Measured projection stage</text>
</svg>
