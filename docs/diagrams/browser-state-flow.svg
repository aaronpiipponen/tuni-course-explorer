<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 672" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Browser state, the open tab and the server reads</title>
  <desc id="d">Before the shell mounts, the app asks the server once for the site's feature switches and keeps
  the answer for the visit. A tab action is written into the browser tab's session storage, which holds the
  open tab, and a course or settings action is written into browser storage, which holds every saved profile.
  Browser storage publishes the current profile, which is also read back at the start of the app. The current
  profile supplies the request inputs, a typed client sends them to the read-only web server as a read
  request, and the server report becomes the transient result that the open tab shows. The dashed boxes are
  the reports that are never persisted, and the accent arrow marks the read request.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a98ae0"/>
    </marker>
  </defs>
  <rect width="960" height="672" rx="12" fill="#232434"/>

  <text x="40" y="34" font-size="16" fill="#a3a4b8">Before the shell mounts</text>

  <rect x="40" y="56" width="230" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="155" y="82" text-anchor="middle" font-size="16" fill="#ececf2">App start</text>
  <text x="155" y="104" text-anchor="middle" font-size="14" fill="#a3a4b8">the first request</text>

  <rect x="410" y="56" width="250" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="535" y="82" text-anchor="middle" font-size="16" fill="#ececf2">Feature read</text>
  <text x="535" y="104" text-anchor="middle" font-size="14" fill="#a3a4b8">POST /api/features</text>

  <rect x="740" y="56" width="196" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="838" y="82" text-anchor="middle" font-size="16" fill="#ececf2">Feature switches</text>
  <text x="838" y="104" text-anchor="middle" font-size="14" fill="#a3a4b8">the two settings</text>

  <rect x="40" y="160" width="230" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="155" y="186" text-anchor="middle" font-size="16" fill="#ececf2">Course and settings</text>
  <text x="155" y="208" text-anchor="middle" font-size="14" fill="#a3a4b8">changed by an action</text>

  <rect x="410" y="160" width="250" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="535" y="186" text-anchor="middle" font-size="16" fill="#ececf2">Browser storage</text>
  <text x="535" y="208" text-anchor="middle" font-size="14" fill="#a3a4b8">every profile, saved</text>

  <rect x="740" y="160" width="196" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="838" y="186" text-anchor="middle" font-size="16" fill="#ececf2">Current profile</text>
  <text x="838" y="208" text-anchor="middle" font-size="14" fill="#a3a4b8">published state</text>

  <rect x="40" y="264" width="230" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="155" y="290" text-anchor="middle" font-size="16" fill="#ececf2">Tab changes</text>
  <text x="155" y="312" text-anchor="middle" font-size="14" fill="#a3a4b8">the open tab</text>

  <rect x="410" y="264" width="250" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="535" y="290" text-anchor="middle" font-size="16" fill="#ececf2">Tab session storage</text>
  <text x="535" y="312" text-anchor="middle" font-size="14" fill="#a3a4b8">the open tab</text>

  <rect x="740" y="264" width="196" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="838" y="290" text-anchor="middle" font-size="16" fill="#ececf2">Request inputs</text>
  <text x="838" y="312" text-anchor="middle" font-size="14" fill="#a3a4b8">courses, options</text>

  <rect x="740" y="368" width="196" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="838" y="394" text-anchor="middle" font-size="16" fill="#ececf2">API client</text>
  <text x="838" y="416" text-anchor="middle" font-size="14" fill="#a3a4b8">typed read client</text>

  <rect x="740" y="472" width="196" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="838" y="498" text-anchor="middle" font-size="16" fill="#ececf2">Server report</text>
  <text x="838" y="520" text-anchor="middle" font-size="14" fill="#a3a4b8">read-only server</text>

  <rect x="740" y="576" width="196" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="838" y="602" text-anchor="middle" font-size="16" fill="#ececf2">Tab result</text>
  <text x="838" y="624" text-anchor="middle" font-size="14" fill="#a3a4b8">shown, not saved</text>

  <line x1="270" y1="88" x2="410" y2="88" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="340" y="76" text-anchor="middle" font-size="14" fill="#a3a4b8">asks once</text>

  <line x1="660" y1="88" x2="740" y2="88" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="700" y="76" text-anchor="middle" font-size="14" fill="#a3a4b8">report</text>

  <line x1="270" y1="192" x2="410" y2="192" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="340" y="180" text-anchor="middle" font-size="14" fill="#a3a4b8">written first</text>

  <line x1="660" y1="192" x2="740" y2="192" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="700" y="148" text-anchor="middle" font-size="14" fill="#a3a4b8">published after the write, read at startup</text>

  <line x1="270" y1="296" x2="410" y2="296" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="340" y="284" text-anchor="middle" font-size="14" fill="#a3a4b8">written first</text>

  <line x1="838" y1="224" x2="838" y2="264" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="830" y="252" text-anchor="end" font-size="14" fill="#a3a4b8">supplies the inputs</text>

  <line x1="838" y1="328" x2="838" y2="368" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="830" y="356" text-anchor="end" font-size="14" fill="#a3a4b8">typed request</text>

  <line x1="838" y1="432" x2="838" y2="472" stroke="#a98ae0" stroke-width="1.5"
        marker-end="url(#arrow-accent)"/>
  <text x="830" y="460" text-anchor="end" font-size="14" fill="#a3a4b8">read</text>

  <line x1="838" y1="536" x2="838" y2="576" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="830" y="564" text-anchor="end" font-size="14" fill="#a3a4b8">report</text>

  <polyline points="660,296 700,296 700,608 740,608" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="690" y="450" text-anchor="end" font-size="14" fill="#a3a4b8">shown by the open tab</text>

  <rect x="40" y="564" width="240" height="76" rx="8" fill="none" stroke="#4a4c6b" stroke-width="1.5"/>
  <rect x="64" y="581" width="24" height="14" rx="2" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="108" y="593" font-size="14" fill="#a3a4b8">Transient reports</text>
  <line x1="56" y1="616" x2="96" y2="616" stroke="#a98ae0" stroke-width="1.5"
        marker-end="url(#arrow-accent)"/>
  <text x="108" y="621" font-size="14" fill="#a3a4b8">Read request</text>
</svg>
