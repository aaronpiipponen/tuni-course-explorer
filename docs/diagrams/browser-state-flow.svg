<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 672" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Browser state, the caches, the open tab and the server reads</title>
  <desc id="d">Before the shell mounts, the app asks the server once for the site's feature switches and the
  serving dataset identity, and keeps the answer for the visit. A tab action is written into the browser tab's session storage, which holds the
  open tab, and a course or settings action is written into browser storage, which holds every saved profile.
  Browser storage publishes the current profile. The current
  profile supplies the request inputs, a typed client sends them to the read-only web server as a read
  request, and the server report becomes the tab result. A successful report joins the
  read cache, a discovery report also joins the discovery cache, and a structure report joins the
  derived structure store. The dashed boxes and lines mark cached, transient or derived values, and the
  accent arrow marks the read request.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a98ae0"/>
    </marker>
  </defs>
  <rect width="960" height="672" rx="12" fill="#232434"/>

  <text x="32" y="44" font-size="16" fill="#a3a4b8">Before the shell mounts</text>

  <rect x="32" y="64" width="220" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="142" y="90" text-anchor="middle" font-size="16" fill="#ececf2">App start</text>
  <text x="142" y="112" text-anchor="middle" font-size="14" fill="#a3a4b8">the first request</text>

  <rect x="368" y="64" width="244" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="490" y="90" text-anchor="middle" font-size="16" fill="#ececf2">Feature read</text>
  <text x="490" y="112" text-anchor="middle" font-size="14" fill="#a3a4b8">switches and identity</text>

  <rect x="728" y="64" width="200" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="828" y="90" text-anchor="middle" font-size="16" fill="#ececf2">Feature report</text>
  <text x="828" y="112" text-anchor="middle" font-size="14" fill="#a3a4b8">settings and identity</text>

  <rect x="32" y="168" width="220" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="142" y="194" text-anchor="middle" font-size="16" fill="#ececf2">Course and settings</text>
  <text x="142" y="216" text-anchor="middle" font-size="14" fill="#a3a4b8">changed by an action</text>

  <rect x="368" y="168" width="244" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="490" y="194" text-anchor="middle" font-size="16" fill="#ececf2">Browser storage</text>
  <text x="490" y="216" text-anchor="middle" font-size="14" fill="#a3a4b8">every profile, saved</text>

  <rect x="728" y="168" width="200" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="828" y="194" text-anchor="middle" font-size="16" fill="#ececf2">Current profile</text>
  <text x="828" y="216" text-anchor="middle" font-size="14" fill="#a3a4b8">published state</text>

  <rect x="32" y="272" width="220" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="142" y="298" text-anchor="middle" font-size="16" fill="#ececf2">Tab changes</text>
  <text x="142" y="320" text-anchor="middle" font-size="14" fill="#a3a4b8">a tab action</text>

  <rect x="368" y="272" width="244" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="490" y="298" text-anchor="middle" font-size="16" fill="#ececf2">Tab session storage</text>
  <text x="490" y="320" text-anchor="middle" font-size="14" fill="#a3a4b8">the open tab</text>

  <rect x="728" y="272" width="200" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="828" y="298" text-anchor="middle" font-size="16" fill="#ececf2">Request inputs</text>
  <text x="828" y="320" text-anchor="middle" font-size="14" fill="#a3a4b8">courses, options</text>

  <rect x="368" y="376" width="244" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="490" y="402" text-anchor="middle" font-size="16" fill="#ececf2">Read cache</text>
  <text x="490" y="424" text-anchor="middle" font-size="14" fill="#a3a4b8">successful reads</text>

  <rect x="728" y="376" width="200" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="828" y="402" text-anchor="middle" font-size="16" fill="#ececf2">API client</text>
  <text x="828" y="424" text-anchor="middle" font-size="14" fill="#a3a4b8">typed read client</text>

  <rect x="368" y="480" width="244" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="490" y="506" text-anchor="middle" font-size="16" fill="#ececf2">Derived structure store</text>
  <text x="490" y="528" text-anchor="middle" font-size="14" fill="#a3a4b8">IndexedDB, reports</text>

  <rect x="728" y="472" width="200" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="828" y="498" text-anchor="middle" font-size="16" fill="#ececf2">Server report</text>
  <text x="828" y="520" text-anchor="middle" font-size="14" fill="#a3a4b8">read-only server</text>

  <rect x="368" y="584" width="244" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="490" y="610" text-anchor="middle" font-size="16" fill="#ececf2">Discovery cache</text>
  <text x="490" y="632" text-anchor="middle" font-size="14" fill="#a3a4b8">local storage</text>

  <rect x="728" y="584" width="200" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="828" y="610" text-anchor="middle" font-size="16" fill="#ececf2">Tab result</text>
  <text x="828" y="632" text-anchor="middle" font-size="14" fill="#a3a4b8">shown by the tab</text>

  <line x1="252" y1="96" x2="368" y2="96" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="310" y="84" text-anchor="middle" font-size="14" fill="#a3a4b8">asks once</text>

  <line x1="612" y1="96" x2="728" y2="96" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="670" y="84" text-anchor="middle" font-size="14" fill="#a3a4b8">report</text>

  <line x1="252" y1="200" x2="368" y2="200" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="310" y="188" text-anchor="middle" font-size="14" fill="#a3a4b8">written</text>

  <line x1="612" y1="200" x2="728" y2="200" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="670" y="188" text-anchor="middle" font-size="14" fill="#a3a4b8">published</text>

  <line x1="252" y1="304" x2="368" y2="304" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="310" y="292" text-anchor="middle" font-size="14" fill="#a3a4b8">written</text>

  <line x1="828" y1="232" x2="828" y2="272" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="818" y="256" text-anchor="end" font-size="14" fill="#a3a4b8">supplies the inputs</text>

  <line x1="828" y1="336" x2="828" y2="376" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="818" y="360" text-anchor="end" font-size="14" fill="#a3a4b8">typed request</text>

  <line x1="828" y1="440" x2="828" y2="472" stroke="#a98ae0" stroke-width="1.5"
        marker-end="url(#arrow-accent)"/>
  <text x="818" y="460" text-anchor="end" font-size="14" fill="#a3a4b8">read</text>

  <line x1="828" y1="536" x2="828" y2="584" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="818" y="564" text-anchor="end" font-size="14" fill="#a3a4b8">report</text>

  <polyline points="728,480 664,480 664,408 612,408" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="674" y="448" font-size="14" fill="#a3a4b8">held</text>

  <line x1="728" y1="512" x2="612" y2="512" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="670" y="500" text-anchor="middle" font-size="14" fill="#a3a4b8">structures</text>

  <polyline points="728,528 680,528 680,616 612,616" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="668" y="576" text-anchor="end" font-size="14" fill="#a3a4b8">discovery</text>

  <rect x="32" y="488" width="324" height="76" rx="8" fill="none" stroke="#4a4c6b" stroke-width="1.5"/>
  <line x1="48" y1="512" x2="88" y2="512" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="100" y="517" font-size="14" fill="#a3a4b8">Cached, transient or derived</text>
  <line x1="48" y1="544" x2="88" y2="544" stroke="#a98ae0" stroke-width="1.5"
        marker-end="url(#arrow-accent)"/>
  <text x="100" y="549" font-size="14" fill="#a3a4b8">Read request</text>
</svg>
