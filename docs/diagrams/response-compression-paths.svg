<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Response compression paths</title>
  <desc id="d">The supervisor compresses the catalogue body once before the workers fork. The
  catalogue route answers from that preloaded gzip body. Every other response passes through
  GZipMiddleware, which compresses a body of at least 500 bytes at level 6. The accent marks the
  preloaded gzip body.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a98ae0"/>
    </marker>
  </defs>
  <rect width="960" height="380" rx="12" fill="#232434"/>

  <rect x="460" y="40" width="252" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="586" y="66" text-anchor="middle" font-size="16" fill="#ececf2">Supervisor preload</text>
  <text x="586" y="88" text-anchor="middle" font-size="14" fill="#a3a4b8">before the workers fork</text>

  <rect x="48" y="136" width="168" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="132" y="162" text-anchor="middle" font-size="16" fill="#ececf2">Catalogue read</text>
  <text x="132" y="184" text-anchor="middle" font-size="14" fill="#a3a4b8">one request</text>

  <rect x="240" y="136" width="196" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="338" y="162" text-anchor="middle" font-size="16" fill="#ececf2">Catalogue route</text>
  <text x="338" y="184" text-anchor="middle" font-size="14" fill="#a3a4b8">preloaded body</text>

  <rect x="460" y="136" width="252" height="64" rx="8"
        fill="#2e3045" stroke="#a98ae0" stroke-width="1.5"/>
  <text x="586" y="162" text-anchor="middle" font-size="16" fill="#ececf2">Gzip body</text>
  <text x="586" y="184" text-anchor="middle" font-size="14" fill="#a3a4b8">once, at level 6</text>

  <rect x="736" y="136" width="176" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="824" y="162" text-anchor="middle" font-size="16" fill="#ececf2">Response</text>
  <text x="824" y="184" text-anchor="middle" font-size="14" fill="#a3a4b8">gzip or plain</text>

  <rect x="48" y="264" width="168" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="132" y="290" text-anchor="middle" font-size="16" fill="#ececf2">Other request</text>
  <text x="132" y="312" text-anchor="middle" font-size="14" fill="#a3a4b8">one request</text>

  <rect x="240" y="264" width="196" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="338" y="290" text-anchor="middle" font-size="16" fill="#ececf2">Route</text>
  <text x="338" y="312" text-anchor="middle" font-size="14" fill="#a3a4b8">JSON body</text>

  <rect x="460" y="264" width="252" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="586" y="290" text-anchor="middle" font-size="16" fill="#ececf2">GZipMiddleware</text>
  <text x="586" y="312" text-anchor="middle" font-size="14" fill="#a3a4b8">level 6, from 500 bytes</text>

  <rect x="736" y="264" width="176" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="824" y="290" text-anchor="middle" font-size="16" fill="#ececf2">Response</text>
  <text x="824" y="312" text-anchor="middle" font-size="14" fill="#a3a4b8">gzip or plain</text>

  <line x1="586" y1="104" x2="586" y2="136" stroke="#a98ae0"
        stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="594" y="124" font-size="14" fill="#a3a4b8">once</text>

  <line x1="216" y1="168" x2="240" y2="168" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="436" y1="168" x2="460" y2="168" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="712" y1="168" x2="736" y2="168" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="216" y1="296" x2="240" y2="296" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="436" y1="296" x2="460" y2="296" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="712" y1="296" x2="736" y2="296" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
