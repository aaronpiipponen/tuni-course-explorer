<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Operator disposition of one target course</title>
  <desc id="d">One target course holds one operator decision. The three decisions are Automatic,
  Done and Failed. From Automatic an operator sets done or sets failed. From Done an operator sets
  failed or clears. From Failed an operator sets done or clears. Clearing returns the target course
  to Automatic. A repeated decision draws no self transition.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="392" rx="12" fill="#232434"/>

  <rect x="64" y="64" width="240" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="184" y="90" text-anchor="middle" font-size="16" fill="#ececf2">Done</text>
  <text x="184" y="112" text-anchor="middle" font-size="14" fill="#a3a4b8">Complete without output</text>

  <rect x="656" y="64" width="240" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="776" y="90" text-anchor="middle" font-size="16" fill="#ececf2">Failed</text>
  <text x="776" y="112" text-anchor="middle" font-size="14" fill="#a3a4b8">Skipped, cycle incomplete</text>

  <rect x="360" y="296" width="240" height="64" rx="8" fill="#2e3045" stroke="#a98ae0" stroke-width="1.5"/>
  <text x="480" y="322" text-anchor="middle" font-size="16" fill="#ececf2">Automatic</text>
  <text x="480" y="344" text-anchor="middle" font-size="14" fill="#a3a4b8">Ordinary scheduling</text>

  <polyline points="360,328 40,328 40,40 184,40 184,64" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="196" y="56" font-size="14" fill="#a3a4b8">set done</text>

  <polyline points="600,328 920,328 920,40 776,40 776,64" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="764" y="56" text-anchor="end" font-size="14" fill="#a3a4b8">set failed</text>

  <polyline points="184,128 184,212 440,212 440,296" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="452" y="288" font-size="14" fill="#a3a4b8">clear</text>

  <polyline points="776,128 776,232 520,232 520,296" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="532" y="288" font-size="14" fill="#a3a4b8">clear</text>

  <line x1="304" y1="80" x2="656" y2="80" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="480" y="72" text-anchor="middle" font-size="14" fill="#a3a4b8">set failed</text>

  <line x1="656" y1="112" x2="304" y2="112" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="480" y="132" text-anchor="middle" font-size="14" fill="#a3a4b8">set done</text>
</svg>
