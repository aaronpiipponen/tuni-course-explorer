<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 496" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Documentation wiki build and reading</title>
  <desc id="d">The wiki configuration, the selected Markdown pages and the local images they
  reference feed the wiki build compiler. The compiler produces the page records of the registry
  that the wiki reader shows, and it turns a link to a file the wiki does not render into an
  address in the GitHub repository. The dashed arrow marks that unlisted file link.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="496" rx="12" fill="#232434"/>

  <rect x="64" y="64" width="246" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="187" y="90" text-anchor="middle" font-size="16" fill="#ececf2">Wiki configuration</text>
  <text x="187" y="112" text-anchor="middle" font-size="14" fill="#a3a4b8">config/wiki.json</text>

  <rect x="358" y="64" width="246" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="481" y="90" text-anchor="middle" font-size="16" fill="#ececf2">Selected Markdown</text>
  <text x="481" y="112" text-anchor="middle" font-size="14" fill="#a3a4b8">docs/ pages</text>

  <rect x="652" y="64" width="244" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="774" y="90" text-anchor="middle" font-size="16" fill="#ececf2">Local images</text>
  <text x="774" y="112" text-anchor="middle" font-size="14" fill="#a3a4b8">diagrams and screenshots</text>

  <rect x="360" y="176" width="240" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="202" text-anchor="middle" font-size="16" fill="#ececf2">Wiki build compiler</text>
  <text x="480" y="224" text-anchor="middle" font-size="14" fill="#a3a4b8">Selection, text, assets</text>

  <rect x="64" y="288" width="246" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="187" y="314" text-anchor="middle" font-size="16" fill="#ececf2">Page registry</text>
  <text x="187" y="336" text-anchor="middle" font-size="14" fill="#a3a4b8">metadata and HTML</text>

  <rect x="358" y="288" width="246" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="481" y="314" text-anchor="middle" font-size="16" fill="#ececf2">Wiki reader</text>
  <text x="481" y="336" text-anchor="middle" font-size="14" fill="#a3a4b8">sidebar and search</text>

  <rect x="652" y="288" width="244" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="774" y="314" text-anchor="middle" font-size="16" fill="#ececf2">GitHub repository</text>
  <text x="774" y="336" text-anchor="middle" font-size="14" fill="#a3a4b8">blob and tree views</text>

  <polyline points="187,128 187,160 420,160 420,176" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="196" y="152" font-size="14" fill="#a3a4b8">selection</text>

  <line x1="481" y1="128" x2="481" y2="176" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="490" y="152" font-size="14" fill="#a3a4b8">page text</text>

  <polyline points="774,128 774,160 540,160 540,176" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="784" y="148" font-size="14" fill="#a3a4b8">bundled assets</text>

  <polyline points="420,240 420,270 187,270 187,288" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="259" font-size="14" fill="#a3a4b8">page records</text>

  <polyline points="540,240 540,270 774,270 774,288" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="560" y="258" font-size="14" fill="#a3a4b8">unlisted file links</text>

  <line x1="310" y1="320" x2="358" y2="320" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <rect x="64" y="416" width="300" height="48" rx="8" fill="none" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <line x1="80" y1="440" x2="120" y2="440" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="132" y="445" font-size="14" fill="#a3a4b8">Unlisted file links</text>
</svg>
