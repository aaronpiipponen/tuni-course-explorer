<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 716" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Official catalogue data model</title>
  <desc id="d">Course and module identities with their exact versions, the curriculum periods a
  version belongs to, and the rows a version holds: one official teaching-text row, many derived
  translation rows, embedding chunks, official prerequisite options, and official substitution
  options for a course version, and the rule nodes of a module version. Each entity lists its
  identity and key columns. Every line is orthogonal and carries a 1 or N label at the end it
  describes.</desc>
