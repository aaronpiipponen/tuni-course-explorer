  <text x="206" y="336" font-size="14" fill="#a3a4b8">N</text>
  <text x="284" y="472" text-anchor="end" font-size="14" fill="#a3a4b8">N</text>

  <polyline points="200,498 268,498 268,524 290,524" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="206" y="490" font-size="14" fill="#a3a4b8">1</text>
  <text x="284" y="516" text-anchor="end" font-size="14" fill="#a3a4b8">N</text>

  <line x1="550" y1="80" x2="650" y2="80" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="556" y="72" font-size="14" fill="#a3a4b8">1</text>
  <text x="644" y="72" text-anchor="end" font-size="14" fill="#a3a4b8">1</text>

  <polyline points="550,120 620,120 620,164 650,164" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="556" y="112" font-size="14" fill="#a3a4b8">1</text>
  <text x="644" y="156" text-anchor="end" font-size="14" fill="#a3a4b8">N</text>

  <polyline points="550,160 600,160 600,248 650,248" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="556" y="152" font-size="14" fill="#a3a4b8">1</text>
  <text x="644" y="240" text-anchor="end" font-size="14" fill="#a3a4b8">N</text>

  <polyline points="550,200 580,200 580,338 650,338" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="556" y="192" font-size="14" fill="#a3a4b8">1</text>
  <text x="644" y="330" text-anchor="end" font-size="14" fill="#a3a4b8">N</text>

  <polyline points="550,240 560,240 560,434 650,434" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="556" y="232" font-size="14" fill="#a3a4b8">1</text>
  <text x="644" y="426" text-anchor="end" font-size="14" fill="#a3a4b8">N</text>

  <line x1="550" y1="524" x2="650" y2="524" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="556" y="516" font-size="14" fill="#a3a4b8">1</text>
  <text x="644" y="516" text-anchor="end" font-size="14" fill="#a3a4b8">N</text>
</svg>
