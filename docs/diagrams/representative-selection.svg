<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Representative version selection</title>
  <desc id="d">Each version of a course keeps its greatest curriculum-period membership year at or
  before the current academic year. A version listed only after the current academic year is left
  out. The remaining candidates are ordered by the current academic year, then by the greatest year
  inside the activity window, then by the greatest earlier year. Ties break on the greater source
  modification ordinal and then on the greatest exact source version identity.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="576" rx="12" fill="#232434"/>

  <rect x="48" y="48" width="360" height="40" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="228" y="74" text-anchor="middle" font-size="16" fill="#ececf2">Versions of one course</text>

  <rect x="48" y="120" width="360" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="228" y="146" text-anchor="middle" font-size="16" fill="#ececf2">Listed at or before</text>
  <text x="228" y="168" text-anchor="middle" font-size="14" fill="#a3a4b8">the current academic year?</text>

  <rect x="48" y="216" width="360" height="40" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="228" y="242" text-anchor="middle" font-size="16" fill="#ececf2">Keep each version's greatest year</text>

  <rect x="48" y="288" width="360" height="40" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="228" y="314" text-anchor="middle" font-size="16" fill="#ececf2">Order the candidates</text>

  <rect x="520" y="120" width="392" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="716" y="146" text-anchor="middle" font-size="16" fill="#ececf2">Version left out</text>
  <text x="716" y="168" text-anchor="middle" font-size="14" fill="#a3a4b8">Only future listings</text>

  <rect x="520" y="216" width="392" height="40" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="716" y="242" text-anchor="middle" font-size="16" fill="#ececf2">Prefer a current-year version</text>

  <rect x="520" y="280" width="392" height="40" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="716" y="306" text-anchor="middle" font-size="16" fill="#ececf2">Then the greatest window year</text>

  <rect x="520" y="344" width="392" height="40" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="716" y="370" text-anchor="middle" font-size="16" fill="#ececf2">Then the greatest earlier year</text>

  <rect x="520" y="408" width="392" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="716" y="434" text-anchor="middle" font-size="16" fill="#ececf2">Break ties deterministically</text>
  <text x="716" y="456" text-anchor="middle" font-size="14" fill="#a3a4b8">ordinal, then version id</text>

  <rect x="520" y="504" width="392" height="40" rx="8" fill="#2e3045" stroke="#a98ae0" stroke-width="1.5"/>
  <text x="716" y="530" text-anchor="middle" font-size="16" fill="#ececf2">The representative version</text>

  <line x1="228" y1="88" x2="228" y2="120" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="228" y1="184" x2="228" y2="216" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="240" y="204" font-size="14" fill="#a3a4b8">Yes</text>
  <line x1="228" y1="256" x2="228" y2="288" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="408" y1="152" x2="520" y2="152" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="464" y="144" text-anchor="middle" font-size="14" fill="#a3a4b8">No</text>

  <polyline points="408,308 470,308 470,236 520,236" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="478" y="270" font-size="14" fill="#a3a4b8">kept candidates</text>

  <line x1="716" y1="256" x2="716" y2="280" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="716" y1="320" x2="716" y2="344" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="716" y1="384" x2="716" y2="408" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="716" y1="472" x2="716" y2="504" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
