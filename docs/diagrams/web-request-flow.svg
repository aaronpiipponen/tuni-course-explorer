<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 692" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Dataset request flow</title>
  <desc id="d">A browser sends one dataset read, which passes the front router. The router admits the
  request, appends one request record to the usage file and forwards the read to one of the
  WEB_WORKERS worker processes. The worker process runs the application, request validation accepts
  the closed request model, and the route runs one fixed dataset command. The command reads the
  selected dataset and returns one command report to the browser, and a semantic search sends its
  query text to the embedding service.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="692" rx="12" fill="#232434"/>

  <rect x="280" y="56" width="288" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="424" y="82" text-anchor="middle" font-size="16" fill="#ececf2">Browser app</text>
  <text x="424" y="104" text-anchor="middle" font-size="14" fill="#a3a4b8">sends one request</text>

  <rect x="280" y="152" width="288" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="424" y="178" text-anchor="middle" font-size="16" fill="#ececf2">Front router</text>
  <text x="424" y="200" text-anchor="middle" font-size="14" fill="#a3a4b8">admits and records</text>

  <rect x="280" y="248" width="288" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="424" y="274" text-anchor="middle" font-size="16" fill="#ececf2">Worker processes</text>
  <text x="424" y="296" text-anchor="middle" font-size="14" fill="#a3a4b8">WEB_WORKERS processes</text>

  <rect x="280" y="344" width="288" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="424" y="370" text-anchor="middle" font-size="16" fill="#ececf2">Request validation</text>
  <text x="424" y="392" text-anchor="middle" font-size="14" fill="#a3a4b8">closed request model</text>

  <rect x="280" y="440" width="288" height="64" rx="8"
        fill="#2e3045" stroke="#a98ae0" stroke-width="1.5"/>
  <text x="424" y="466" text-anchor="middle" font-size="16" fill="#ececf2">Dataset command</text>
  <text x="424" y="488" text-anchor="middle" font-size="14" fill="#a3a4b8">one command per read</text>

  <rect x="280" y="536" width="288" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="424" y="562" text-anchor="middle" font-size="16" fill="#ececf2">Command report</text>
  <text x="424" y="584" text-anchor="middle" font-size="14" fill="#a3a4b8">one report per dataset read</text>

  <rect x="672" y="152" width="240" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="792" y="178" text-anchor="middle" font-size="16" fill="#ececf2">Usage file</text>
  <text x="792" y="200" text-anchor="middle" font-size="14" fill="#a3a4b8">one record per request</text>

  <rect x="672" y="424" width="240" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="792" y="450" text-anchor="middle" font-size="16" fill="#ececf2">Embedding service</text>
  <text x="792" y="472" text-anchor="middle" font-size="14" fill="#a3a4b8">semantic search only</text>

  <rect x="672" y="536" width="240" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="792" y="562" text-anchor="middle" font-size="16" fill="#ececf2">Selected dataset</text>
  <text x="792" y="584" text-anchor="middle" font-size="14" fill="#a3a4b8">one dataset</text>

  <line x1="424" y1="120" x2="424" y2="152" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="424" y1="216" x2="424" y2="248" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="432" y="237" font-size="14" fill="#a3a4b8">forwards</text>
  <line x1="424" y1="312" x2="424" y2="344" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="432" y="333" font-size="14" fill="#a3a4b8">serves the route</text>
  <line x1="424" y1="408" x2="424" y2="440" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="424" y1="504" x2="424" y2="536" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="432" y="525" font-size="14" fill="#a3a4b8">returns</text>

  <line x1="568" y1="184" x2="672" y2="184" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="576" y="172" font-size="14" fill="#a3a4b8">appends</text>

  <line x1="568" y1="456" x2="672" y2="456" stroke="#a3a4b8"
        stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="580" y="444" font-size="14" fill="#a3a4b8">query text</text>

  <polyline points="568,488 608,488 608,568 672,568" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="616" y="520" font-size="14" fill="#a3a4b8">reads</text>

  <path d="M280 568 H48 V88 H280" fill="none" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="56" y="320" font-size="14" fill="#a3a4b8">one report</text>

  <rect x="48" y="612" width="256" height="48" rx="8"
        fill="none" stroke="#4a4c6b" stroke-width="1.5"/>
  <line x1="64" y1="636" x2="104" y2="636" stroke="#a3a4b8"
        stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="116" y="641" font-size="14" fill="#a3a4b8">Semantic search only</text>
</svg>
