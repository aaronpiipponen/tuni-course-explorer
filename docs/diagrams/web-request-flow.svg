<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 692" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Web request flow</title>
  <desc id="d">A browser request passes the front router, which forwards it to one of the WEB_WORKERS
  worker processes. The worker process runs the application, request validation accepts the closed
  request model, and the route runs one fixed dataset command or the feature read. The dataset
  command reads the selected dataset and returns one JSON report to the browser, and a semantic
  search sends its query text to the embedding service. The feature read runs no command. The front
  router admits the request and appends one request record per request to the usage file.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="692" rx="12" fill="#232434"/>

  <rect x="312" y="56" width="224" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="424" y="82" text-anchor="middle" font-size="16" fill="#ececf2">Browser app</text>
  <text x="424" y="104" text-anchor="middle" font-size="14" fill="#a3a4b8">sends one request</text>

  <rect x="312" y="152" width="224" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="424" y="178" text-anchor="middle" font-size="16" fill="#ececf2">Front router</text>
  <text x="424" y="200" text-anchor="middle" font-size="14" fill="#a3a4b8">admits and records</text>

  <rect x="312" y="248" width="224" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="424" y="274" text-anchor="middle" font-size="16" fill="#ececf2">Worker processes</text>
  <text x="424" y="296" text-anchor="middle" font-size="14" fill="#a3a4b8">WEB_WORKERS processes</text>

  <rect x="312" y="344" width="224" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="424" y="370" text-anchor="middle" font-size="16" fill="#ececf2">Request validation</text>
  <text x="424" y="392" text-anchor="middle" font-size="14" fill="#a3a4b8">closed request model</text>

  <rect x="312" y="440" width="224" height="64" rx="8"
        fill="#2e3045" stroke="#a98ae0" stroke-width="1.5"/>
  <text x="424" y="466" text-anchor="middle" font-size="16" fill="#ececf2">Dataset command</text>
  <text x="424" y="488" text-anchor="middle" font-size="14" fill="#a3a4b8">one command per read</text>

  <rect x="312" y="536" width="224" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="424" y="562" text-anchor="middle" font-size="16" fill="#ececf2">JSON report</text>
  <text x="424" y="584" text-anchor="middle" font-size="14" fill="#a3a4b8">one report per request</text>

  <rect x="672" y="152" width="240" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="792" y="178" text-anchor="middle" font-size="16" fill="#ececf2">Usage file</text>
  <text x="792" y="200" text-anchor="middle" font-size="14" fill="#a3a4b8">one record per request</text>

  <rect x="672" y="344" width="240" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="792" y="370" text-anchor="middle" font-size="16" fill="#ececf2">Feature read</text>
  <text x="792" y="392" text-anchor="middle" font-size="14" fill="#a3a4b8">POST /api/features</text>

  <rect x="672" y="440" width="240" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="792" y="466" text-anchor="middle" font-size="16" fill="#ececf2">Embedding service</text>
  <text x="792" y="488" text-anchor="middle" font-size="14" fill="#a3a4b8">semantic search only</text>

  <rect x="672" y="536" width="240" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="792" y="562" text-anchor="middle" font-size="16" fill="#ececf2">Selected dataset</text>
  <text x="792" y="584" text-anchor="middle" font-size="14" fill="#a3a4b8">one dataset</text>

  <line x1="424" y1="120" x2="424" y2="152" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="424" y1="216" x2="424" y2="248" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="432" y="237" font-size="14" fill="#a3a4b8">forwards</text>
  <line x1="424" y1="312" x2="424" y2="344" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="432" y="333" font-size="14" fill="#a3a4b8">serves the route</text>
  <line x1="424" y1="408" x2="424" y2="440" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="424" y1="504" x2="424" y2="536" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="432" y="525" font-size="14" fill="#a3a4b8">returns</text>

  <line x1="536" y1="184" x2="672" y2="184" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="568" y="172" font-size="14" fill="#a3a4b8">appends</text>

  <line x1="536" y1="376" x2="672" y2="376" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="548" y="364" font-size="14" fill="#a3a4b8">no command</text>

  <line x1="536" y1="472" x2="672" y2="472" stroke="#a3a4b8"
        stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="552" y="460" font-size="14" fill="#a3a4b8">query text</text>

  <polyline points="536,488 608,488 608,568 672,568" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="552" y="530" font-size="14" fill="#a3a4b8">reads</text>

  <path d="M312 568 H160 V88 H312" fill="none" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="168" y="320" font-size="14" fill="#a3a4b8">one JSON report</text>

  <rect x="48" y="612" width="256" height="48" rx="8"
        fill="none" stroke="#4a4c6b" stroke-width="1.5"/>
  <line x1="64" y1="636" x2="104" y2="636" stroke="#a3a4b8"
        stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="116" y="641" font-size="14" fill="#a3a4b8">Semantic search only</text>
</svg>
