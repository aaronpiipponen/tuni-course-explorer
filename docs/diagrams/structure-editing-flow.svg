<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 632" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Structure editing flow</title>
  <desc id="d">The official structure report and the saved profile edits together produce the displayed
  structure, which holds one place for each module and course. A user action chooses, moves or resets a
  module, course or option, which saves the profile edits and updates the shared selection. A selected
  course that has no place is listed under Unplaced studies, and a completed course left without a place
  keeps its completion and stays there.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="632" rx="12" fill="#232434"/>

  <rect x="110" y="56" width="300" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="260" y="82" text-anchor="middle" font-size="16" fill="#ececf2">Official structure report</text>
  <text x="260" y="104" text-anchor="middle" font-size="14" fill="#a3a4b8">official rules</text>

  <rect x="550" y="56" width="300" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="700" y="82" text-anchor="middle" font-size="16" fill="#ececf2">Saved profile edits</text>
  <text x="700" y="104" text-anchor="middle" font-size="14" fill="#a3a4b8">read from the profile</text>

  <rect x="330" y="176" width="300" height="64" rx="8" fill="#2e3045" stroke="#a98ae0" stroke-width="1.5"/>
  <text x="480" y="202" text-anchor="middle" font-size="16" fill="#ececf2">Displayed structure</text>
  <text x="480" y="224" text-anchor="middle" font-size="14" fill="#a3a4b8">modules and courses</text>

  <rect x="330" y="296" width="300" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="322" text-anchor="middle" font-size="16" fill="#ececf2">User action</text>
  <text x="480" y="344" text-anchor="middle" font-size="14" fill="#a3a4b8">choose, move, reset</text>

  <rect x="110" y="416" width="270" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="245" y="442" text-anchor="middle" font-size="16" fill="#ececf2">Stored profile edits</text>
  <text x="245" y="464" text-anchor="middle" font-size="14" fill="#a3a4b8">saved before publish</text>

  <rect x="420" y="416" width="280" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="560" y="442" text-anchor="middle" font-size="16" fill="#ececf2">Canonical selection</text>
  <text x="560" y="464" text-anchor="middle" font-size="14" fill="#a3a4b8">selected, completed</text>

  <rect x="420" y="536" width="280" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="560" y="562" text-anchor="middle" font-size="16" fill="#ececf2">Unplaced studies</text>
  <text x="560" y="584" text-anchor="middle" font-size="14" fill="#a3a4b8">no official place</text>

  <line x1="360" y1="120" x2="360" y2="176" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="350" y="152" text-anchor="end" font-size="14" fill="#a3a4b8">official rules and courses</text>

  <line x1="600" y1="120" x2="600" y2="176" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="610" y="152" font-size="14" fill="#a3a4b8">choices and places</text>

  <line x1="480" y1="240" x2="480" y2="296" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="490" y="272" font-size="14" fill="#a3a4b8">the reader acts</text>

  <line x1="360" y1="360" x2="360" y2="416" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="326" y="392" text-anchor="end" font-size="14" fill="#a3a4b8">saved</text>

  <line x1="560" y1="360" x2="560" y2="416" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="570" y="392" font-size="14" fill="#a3a4b8">selection and completion</text>

  <line x1="500" y1="480" x2="500" y2="536" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="490" y="512" text-anchor="end" font-size="14" fill="#a3a4b8">courses with no place</text>

  <line x1="620" y1="480" x2="620" y2="536" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="630" y="512" font-size="14" fill="#a3a4b8">completion kept</text>

  <rect x="48" y="536" width="260" height="48" rx="8" fill="none" stroke="#4a4c6b" stroke-width="1.5"/>
  <line x1="64" y1="560" x2="104" y2="560" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="116" y="565" font-size="14" fill="#a3a4b8">Depends on the action</text>
</svg>
