<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Matched bounded read comparison</title>
  <desc id="d">One saved 50-course pool feeds two legs of the matched comparison. The materialized leg
  holds 7,657 descriptive carriers in memory and the bounded leg holds partitions of at most 256 rows
  and one partition at a time. Both legs score with the same float64 consumer, return 319 of 319
  results and the same ordered result digest, and peak at 546.9 MB and 171.5 MB.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="480" rx="12" fill="#232434"/>

  <rect x="320" y="72" width="320" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="98" text-anchor="middle" font-size="16" fill="#ececf2">Saved 50-course pool</text>
  <text x="480" y="120" text-anchor="middle" font-size="14" fill="#a3a4b8">309 basis and 11,405 candidate rows</text>

  <line x1="480" y1="136" x2="480" y2="160" stroke="#a3a4b8" stroke-width="1.5"/>
  <line x1="260" y1="160" x2="700" y2="160" stroke="#a3a4b8" stroke-width="1.5"/>
  <line x1="260" y1="160" x2="260" y2="192" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="700" y1="160" x2="700" y2="192" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <text x="64" y="184" font-size="16" fill="#a3a4b8">Materialized leg</text>
  <text x="504" y="184" font-size="16" fill="#a3a4b8">Bounded leg</text>

  <rect x="64" y="200" width="392" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="260" y="226" text-anchor="middle" font-size="16" fill="#ececf2">Descriptive read</text>
  <text x="260" y="248" text-anchor="middle" font-size="14" fill="#a3a4b8">one carrier per row</text>

  <rect x="504" y="200" width="392" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="700" y="226" text-anchor="middle" font-size="16" fill="#ececf2">Streamed read</text>
  <text x="700" y="248" text-anchor="middle" font-size="14" fill="#a3a4b8">partitions of at most 256 rows</text>

  <line x1="260" y1="264" x2="260" y2="300" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="700" y1="264" x2="700" y2="300" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <rect x="64" y="300" width="392" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="260" y="326" text-anchor="middle" font-size="16" fill="#ececf2">Float64 consumer</text>
  <text x="260" y="348" text-anchor="middle" font-size="14" fill="#a3a4b8">7,657 carriers held in memory</text>

  <rect x="504" y="300" width="392" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="700" y="326" text-anchor="middle" font-size="16" fill="#ececf2">Float64 consumer</text>
  <text x="700" y="348" text-anchor="middle" font-size="14" fill="#a3a4b8">one matrix and one partition</text>

  <text x="64" y="396" font-size="14" fill="#a3a4b8">546.9 MB process peak</text>
  <text x="64" y="416" font-size="14" fill="#a3a4b8">263.7 MB largest recorded growth</text>
  <text x="504" y="396" font-size="14" fill="#a3a4b8">171.5 MB process peak</text>
  <text x="504" y="416" font-size="14" fill="#a3a4b8">10.8 MB largest recorded growth</text>

  <text x="64" y="456" font-size="14" fill="#a3a4b8">Both legs returned 319 of 319 results and the same ordered result digest</text>
</svg>
