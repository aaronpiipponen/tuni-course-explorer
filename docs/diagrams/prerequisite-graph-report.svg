<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Prerequisite graph report</title>
  <desc id="d">One graph read returns the solver structure with its support bindings, the drawing and
  the drawing allowance. The browser route calculation reads the held solver structure with the live
  profile inputs and returns a route outcome.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="320" rx="12" fill="#232434"/>

  <rect x="48" y="108" width="200" height="104" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="148" y="154" text-anchor="middle" font-size="16" fill="#ececf2">Graph read</text>
  <text x="148" y="176" text-anchor="middle" font-size="14" fill="#a3a4b8">one request</text>

  <rect x="320" y="32" width="248" height="64" rx="8" fill="#2e3045"
        stroke="#a98ae0" stroke-width="1.5"/>
  <text x="444" y="58" text-anchor="middle" font-size="16" fill="#ececf2">Solver structure</text>
  <text x="444" y="80" text-anchor="middle" font-size="14" fill="#a3a4b8">with its support bindings</text>

  <rect x="320" y="128" width="248" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="444" y="154" text-anchor="middle" font-size="16" fill="#ececf2">Drawing</text>
  <text x="444" y="176" text-anchor="middle" font-size="14" fill="#a3a4b8">boxes and connections</text>

  <rect x="320" y="224" width="248" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="444" y="250" text-anchor="middle" font-size="16" fill="#ececf2">Drawing allowance</text>
  <text x="444" y="272" text-anchor="middle" font-size="14" fill="#a3a4b8">counts and the limit</text>

  <rect x="632" y="32" width="280" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="772" y="58" text-anchor="middle" font-size="16" fill="#ececf2">Route calculation</text>
  <text x="772" y="80" text-anchor="middle" font-size="14" fill="#a3a4b8">with the live inputs</text>

  <rect x="632" y="128" width="280" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="772" y="154" text-anchor="middle" font-size="16" fill="#ececf2">Route outcome</text>
  <text x="772" y="176" text-anchor="middle" font-size="14" fill="#a3a4b8">one of six labels</text>

  <polyline points="248,128 268,128 268,64 320,64" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="248" y1="160" x2="320" y2="160" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <polyline points="248,192 296,192 296,256 320,256" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="568" y1="64" x2="632" y2="64" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="600" y="48" text-anchor="middle" font-size="14" fill="#a3a4b8">reads</text>

  <line x1="772" y1="96" x2="772" y2="128" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
</svg>
