<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Comparison meters</title>
  <desc id="d">Two courses enter the comparison through the stored chunk vectors of their
  representative versions. Every vector is centred by subtracting the hub of its teaching-text
  field: the embedding hub for a name or content chunk and the outcomes hub for a learning-outcomes
  chunk. Five meters then report overall relatedness, content similarity, learning-outcome
  similarity, and overlap in each direction. The strongest directional overlap and otherwise the
  overall relatedness decide the verdict.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="680" rx="12" fill="#232434"/>

  <rect x="24" y="96" width="140" height="40" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="94" y="122" text-anchor="middle" font-size="16" fill="#ececf2">Course A</text>

  <rect x="24" y="176" width="140" height="40" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="94" y="202" text-anchor="middle" font-size="16" fill="#ececf2">Chunks of A</text>

  <rect x="24" y="300" width="140" height="40" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="94" y="326" text-anchor="middle" font-size="16" fill="#ececf2">Course B</text>

  <rect x="24" y="380" width="140" height="40" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="94" y="406" text-anchor="middle" font-size="16" fill="#ececf2">Chunks of B</text>

  <rect x="274" y="288" width="220" height="64" rx="8" fill="#2e3045" stroke="#a98ae0"
        stroke-width="1.5"/>
  <text x="384" y="314" text-anchor="middle" font-size="16" fill="#ececf2">Hub centring</text>
  <text x="384" y="336" text-anchor="middle" font-size="14" fill="#a3a4b8">minus each field's hub</text>

  <rect x="594" y="64" width="292" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="740" y="90" text-anchor="middle" font-size="16" fill="#ececf2">Overall relatedness</text>
  <text x="740" y="112" text-anchor="middle" font-size="14" fill="#a3a4b8">whole text</text>

  <rect x="594" y="160" width="292" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="740" y="186" text-anchor="middle" font-size="16" fill="#ececf2">Content similarity</text>
  <text x="740" y="208" text-anchor="middle" font-size="14" fill="#a3a4b8">content only</text>

  <rect x="594" y="256" width="292" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="740" y="282" text-anchor="middle" font-size="16" fill="#ececf2">Learning-outcome similarity</text>
  <text x="740" y="304" text-anchor="middle" font-size="14" fill="#a3a4b8">learning outcomes</text>

  <rect x="594" y="352" width="292" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="740" y="378" text-anchor="middle" font-size="16" fill="#ececf2">Overlap: A in B</text>
  <text x="740" y="400" text-anchor="middle" font-size="14" fill="#a3a4b8">share of A</text>

  <rect x="594" y="448" width="292" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="740" y="474" text-anchor="middle" font-size="16" fill="#ececf2">Overlap: B in A</text>
  <text x="740" y="496" text-anchor="middle" font-size="14" fill="#a3a4b8">share of B</text>

  <rect x="274" y="584" width="420" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="484" y="610" text-anchor="middle" font-size="16" fill="#ececf2">Verdict</text>
  <text x="484" y="632" text-anchor="middle" font-size="14" fill="#a3a4b8">overlap, then relatedness</text>

  <line x1="94" y1="136" x2="94" y2="176" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="94" y1="340" x2="94" y2="380" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <polyline points="164,196 180,196 180,304 274,304" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="164,400 222,400 222,336 274,336" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="494" y1="320" x2="506" y2="320" stroke="#a3a4b8" stroke-width="1.5"/>
  <line x1="506" y1="96" x2="506" y2="480" stroke="#a3a4b8" stroke-width="1.5"/>
  <line x1="506" y1="96" x2="594" y2="96" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="506" y1="192" x2="594" y2="192" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="506" y1="288" x2="594" y2="288" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="506" y1="384" x2="594" y2="384" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="506" y1="480" x2="594" y2="480" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <polyline points="886,96 936,96 936,568 580,568 580,584" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="886,384 916,384 916,552 460,552 460,584" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="886,480 896,480 896,536 340,536 340,584" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
