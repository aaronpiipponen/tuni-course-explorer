<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 616" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Dataset roles, receipts and rotation</title>
  <desc id="d">The administration state root holds the Selected and Working pointer files, and each
  pointer names its dataset. Every dataset holds one receipt, either the zero-id initial receipt, a
  copied receipt or a returned receipt, and a receipt names its predecessor. Copy to Working writes a
  copied receipt and a dataset return writes a returned receipt, and both publish the Working pointer.
  Rotation keeps each role's dataset and its predecessor.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="616" rx="12" fill="#232434"/>

  <rect x="48" y="40" width="420" height="152" rx="12" fill="none" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="72" y="66" font-size="16" fill="#a3a4b8">ADMIN_STATE_ROOT</text>

  <rect x="72" y="84" width="372" height="40" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="258" y="109" text-anchor="middle" font-size="16" fill="#ececf2">selected-dataset.json</text>

  <rect x="72" y="140" width="372" height="40" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="258" y="165" text-anchor="middle" font-size="16" fill="#ececf2">working-dataset.json</text>

  <rect x="560" y="72" width="352" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="736" y="98" text-anchor="middle" font-size="16" fill="#ececf2">Selected dataset</text>
  <text x="736" y="120" text-anchor="middle" font-size="14" fill="#a3a4b8">the served dataset</text>

  <rect x="560" y="160" width="352" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="736" y="186" text-anchor="middle" font-size="16" fill="#ececf2">Working dataset</text>
  <text x="736" y="208" text-anchor="middle" font-size="14" fill="#a3a4b8">the stages write it</text>

  <line x1="444" y1="104" x2="560" y2="104" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="448" y="94" font-size="14" fill="#a3a4b8">names</text>

  <polyline points="444,160 500,160 500,192 560,192" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="508" y="176" font-size="14" fill="#a3a4b8">names</text>

  <text x="48" y="264" font-size="16" fill="#a3a4b8">Dataset receipts, one per dataset</text>
  <rect x="48" y="272" width="528" height="86" rx="8"
        fill="none" stroke="#4a4c6b" stroke-width="1.5"/>

  <rect x="48" y="284" width="160" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="128" y="310" text-anchor="middle" font-size="16" fill="#ececf2">Initial</text>
  <text x="128" y="332" text-anchor="middle" font-size="14" fill="#a3a4b8">zero id</text>

  <rect x="224" y="284" width="160" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="304" y="310" text-anchor="middle" font-size="16" fill="#ececf2">Copied</text>
  <text x="304" y="332" text-anchor="middle" font-size="14" fill="#a3a4b8">source and dump</text>

  <rect x="400" y="284" width="160" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="310" text-anchor="middle" font-size="16" fill="#ececf2">Returned</text>
  <text x="480" y="332" text-anchor="middle" font-size="14" fill="#a3a4b8">session, dump</text>

  <line x1="400" y1="316" x2="384" y2="316" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="224" y1="316" x2="208" y2="316" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <line x1="560" y1="224" x2="560" y2="272" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="568" y="248" font-size="14" fill="#a3a4b8">holds one</text>

  <text x="48" y="384" font-size="16" fill="#a3a4b8">Each receipt names its predecessor</text>
  <text x="48" y="404" font-size="16" fill="#a3a4b8">and a chain ends at the zero-id initial receipt</text>

  <rect x="568" y="440" width="176" height="40" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="656" y="466" text-anchor="middle" font-size="16" fill="#ececf2">Copy to Working</text>

  <rect x="752" y="440" width="160" height="40" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="832" y="466" text-anchor="middle" font-size="16" fill="#ececf2">Dataset return</text>

  <line x1="656" y1="440" x2="656" y2="224" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="832" y1="440" x2="832" y2="224" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <text x="48" y="512" font-size="16" fill="#a3a4b8">Rotation keeps each role's dataset and its predecessor</text>

  <rect x="48" y="528" width="180" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="138" y="554" text-anchor="middle" font-size="16" fill="#ececf2">Selected</text>
  <text x="138" y="576" text-anchor="middle" font-size="14" fill="#a3a4b8">kept with dump</text>

  <rect x="276" y="528" width="180" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="366" y="554" text-anchor="middle" font-size="16" fill="#ececf2">Predecessor</text>
  <text x="366" y="576" text-anchor="middle" font-size="14" fill="#a3a4b8">of Selected, kept</text>

  <rect x="504" y="528" width="180" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="594" y="554" text-anchor="middle" font-size="16" fill="#ececf2">Working</text>
  <text x="594" y="576" text-anchor="middle" font-size="14" fill="#a3a4b8">kept with dump</text>

  <rect x="732" y="528" width="180" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="822" y="554" text-anchor="middle" font-size="16" fill="#ececf2">Predecessor</text>
  <text x="822" y="576" text-anchor="middle" font-size="14" fill="#a3a4b8">of Working, kept</text>
</svg>
