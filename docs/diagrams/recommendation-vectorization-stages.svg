<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Recommendation scorer, read and composition measurement boundaries</title>
  <desc id="d">One recommendation path starts from a saved candidate pool and runs through dataset
  and settings resolution, a fresh engine and first connection, summary and chunk reads, array
  preparation and scoring, and report serialization to a ranked report. A read sample covers the
  summary and chunk reads and the product field filter, a scorer sample covers conversion through
  the sort, and a composition leg encloses resolution, the engine, the reads, preparation, scoring
  and serialization. The three timers are separate, so their savings do not add.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="720" rx="12" fill="#232434"/>

  <rect x="48" y="64" width="304" height="56" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="200" y="90" text-anchor="middle" font-size="16" fill="#ececf2">Saved candidate pool</text>
  <text x="200" y="110" text-anchor="middle" font-size="14" fill="#a3a4b8">one basis and its candidates</text>

  <rect x="32" y="136" width="336" height="408" rx="8" fill="none"
        stroke="#a98ae0" stroke-width="1.5"/>
  <line x1="368" y1="136" x2="384" y2="132" stroke="#a98ae0" stroke-width="1.5"/>
  <text x="384" y="112" font-size="16" fill="#a3a4b8">Composition leg</text>
  <text x="384" y="132" font-size="14" fill="#a3a4b8">resolution, engine, reads, preparation, scoring, serialization</text>

  <rect x="48" y="160" width="304" height="56" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="200" y="186" text-anchor="middle" font-size="16" fill="#ececf2">Resolve dataset and settings</text>
  <text x="200" y="206" text-anchor="middle" font-size="14" fill="#a3a4b8">named receipt</text>

  <rect x="48" y="240" width="304" height="56" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="200" y="266" text-anchor="middle" font-size="16" fill="#ececf2">Create engine and connect</text>
  <text x="200" y="286" text-anchor="middle" font-size="14" fill="#a3a4b8">first connection and head check</text>

  <rect x="48" y="320" width="304" height="56" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="200" y="346" text-anchor="middle" font-size="16" fill="#ececf2">Summary and chunk reads</text>
  <text x="200" y="366" text-anchor="middle" font-size="14" fill="#a3a4b8">full or projected</text>

  <rect x="48" y="400" width="304" height="56" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="200" y="426" text-anchor="middle" font-size="16" fill="#ececf2">Prepare arrays and score</text>
  <text x="200" y="446" text-anchor="middle" font-size="14" fill="#a3a4b8">scalar or float64</text>

  <rect x="48" y="480" width="304" height="56" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="200" y="506" text-anchor="middle" font-size="16" fill="#ececf2">Serialize report</text>
  <text x="200" y="526" text-anchor="middle" font-size="14" fill="#a3a4b8">ranked report</text>

  <rect x="48" y="560" width="304" height="40" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="200" y="585" text-anchor="middle" font-size="16" fill="#ececf2">Ranked report</text>

  <line x1="200" y1="120" x2="200" y2="160" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="200" y1="216" x2="200" y2="240" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="200" y1="296" x2="200" y2="320" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="200" y1="376" x2="200" y2="400" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="200" y1="456" x2="200" y2="480" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="200" y1="536" x2="200" y2="560" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <line x1="352" y1="320" x2="400" y2="320" stroke="#a3a4b8" stroke-width="1.5"/>
  <line x1="352" y1="376" x2="400" y2="376" stroke="#a3a4b8" stroke-width="1.5"/>
  <line x1="400" y1="320" x2="400" y2="376" stroke="#a3a4b8" stroke-width="1.5"/>
  <text x="416" y="340" font-size="14" fill="#a3a4b8">Read sample: summary and chunk reads,</text>
  <text x="416" y="358" font-size="14" fill="#a3a4b8">then the product field filter</text>

  <line x1="352" y1="400" x2="400" y2="400" stroke="#a3a4b8" stroke-width="1.5"/>
  <line x1="352" y1="456" x2="400" y2="456" stroke="#a3a4b8" stroke-width="1.5"/>
  <line x1="400" y1="400" x2="400" y2="456" stroke="#a3a4b8" stroke-width="1.5"/>
  <text x="416" y="420" font-size="14" fill="#a3a4b8">Scorer sample: conversion</text>
  <text x="416" y="438" font-size="14" fill="#a3a4b8">through sort</text>

  <text x="48" y="656" font-size="14" fill="#a3a4b8">The three timers are separate, so their savings do not add.</text>
</svg>
