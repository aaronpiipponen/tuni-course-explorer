<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Serving cost window</title>
  <desc id="d">One request's measured window covers the web, database and embedding cgroups, and the
  three counters are summed into core-seconds. Client decompression and validation sit after the
  window, and the supervisor preload sits outside it in a cold row.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="440" rx="12" fill="#232434"/>

  <rect x="24" y="88" width="176" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="112" y="114" text-anchor="middle" font-size="16" fill="#ececf2">Load client</text>
  <text x="112" y="136" text-anchor="middle" font-size="14" fill="#a3a4b8">synthetic client</text>

  <line x1="200" y1="120" x2="240" y2="120" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="240" y="56" width="480" height="256" rx="8" fill="none"
        stroke="#a98ae0" stroke-width="1.5"/>
  <text x="256" y="80" font-size="16" fill="#a98ae0">Measured window</text>

  <rect x="264" y="96" width="432" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="122" text-anchor="middle" font-size="16" fill="#ececf2">Web cgroup</text>
  <text x="480" y="144" text-anchor="middle" font-size="14" fill="#a3a4b8">supervisor, front router, workers</text>

  <rect x="264" y="192" width="208" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="368" y="218" text-anchor="middle" font-size="16" fill="#ececf2">Database</text>
  <text x="368" y="240" text-anchor="middle" font-size="14" fill="#a3a4b8">counted whole</text>

  <rect x="488" y="192" width="208" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="592" y="218" text-anchor="middle" font-size="16" fill="#ececf2">Embedding</text>
  <text x="592" y="240" text-anchor="middle" font-size="14" fill="#a3a4b8">counted whole</text>

  <line x1="368" y1="160" x2="368" y2="192" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="376" y="180" font-size="14" fill="#a3a4b8">reads</text>

  <line x1="592" y1="160" x2="592" y2="192" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="180" font-size="14" fill="#a3a4b8">query text</text>

  <line x1="720" y1="120" x2="760" y2="120" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="726" y="110" font-size="14" fill="#a3a4b8">sum</text>

  <rect x="760" y="88" width="176" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="848" y="114" text-anchor="middle" font-size="16" fill="#ececf2">Core-seconds</text>
  <text x="848" y="136" text-anchor="middle" font-size="14" fill="#a3a4b8">three counters</text>

  <text x="240" y="336" font-size="16" fill="#a3a4b8">Outside the measured window</text>

  <rect x="240" y="352" width="248" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="364" y="378" text-anchor="middle" font-size="16" fill="#ececf2">Client work</text>
  <text x="364" y="400" text-anchor="middle" font-size="14" fill="#a3a4b8">after the response</text>

  <rect x="504" y="352" width="248" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="628" y="378" text-anchor="middle" font-size="16" fill="#ececf2">Supervisor preload</text>
  <text x="628" y="400" text-anchor="middle" font-size="14" fill="#a3a4b8">cold rows, recorded apart</text>
</svg>
