<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 688" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Minimum route outcomes</title>
  <desc id="d">One exact search reads the same solver structure and basis as the graph.
  When the exact attempt stays inside the configured size limit, the search yields the exact minimum
  route, a shortfall, an unresolved route, or no route under the rules. When the attempt exceeds the
  size limit, one greedy restart yields an approximate route or no route found.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="688" rx="12" fill="#232434"/>

  <rect x="380" y="32" width="200" height="40" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="58" text-anchor="middle" font-size="16" fill="#ececf2">Route calculation</text>

  <rect x="290" y="104" width="380" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="130" text-anchor="middle" font-size="16" fill="#ececf2">Exact search</text>
  <text x="480" y="152" text-anchor="middle" font-size="14" fill="#a3a4b8">same structure and basis as the graph</text>

  <rect x="290" y="208" width="380" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="234" text-anchor="middle" font-size="16" fill="#ececf2">Size limit</text>
  <text x="480" y="256" text-anchor="middle" font-size="14" fill="#a3a4b8">exceeded by the exact attempt?</text>

  <rect x="24" y="400" width="216" height="64" rx="8" fill="#4e008e" stroke="#a98ae0" stroke-width="1.5"/>
  <text x="132" y="426" text-anchor="middle" font-size="16" fill="#ececf2">Exact minimum route</text>
  <text x="132" y="448" text-anchor="middle" font-size="14" fill="#ececf2">least new credits</text>

  <rect x="288" y="400" width="184" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="380" y="426" text-anchor="middle" font-size="16" fill="#ececf2">Shortfall</text>
  <text x="380" y="448" text-anchor="middle" font-size="14" fill="#a3a4b8">reduced route only</text>

  <rect x="520" y="400" width="186" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="613" y="426" text-anchor="middle" font-size="16" fill="#ececf2">Route unresolved</text>
  <text x="613" y="448" text-anchor="middle" font-size="14" fill="#a3a4b8">cost may be lower</text>

  <rect x="754" y="400" width="176" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="842" y="426" text-anchor="middle" font-size="16" fill="#ececf2">No route exists</text>
  <text x="842" y="448" text-anchor="middle" font-size="14" fill="#a3a4b8">no valid route</text>

  <rect x="416" y="496" width="160" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="496" y="522" text-anchor="middle" font-size="16" fill="#ececf2">Greedy search</text>
  <text x="496" y="544" text-anchor="middle" font-size="14" fill="#a3a4b8">one restart</text>

  <rect x="155" y="592" width="196" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="253" y="618" text-anchor="middle" font-size="16" fill="#ececf2">Approximate route</text>
  <text x="253" y="640" text-anchor="middle" font-size="14" fill="#a3a4b8">greedy route found</text>

  <rect x="399" y="592" width="204" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="501" y="618" text-anchor="middle" font-size="16" fill="#ececf2">No route found</text>
  <text x="501" y="640" text-anchor="middle" font-size="14" fill="#a3a4b8">greedy search missed</text>

  <line x1="480" y1="72" x2="480" y2="104" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="168" x2="480" y2="208" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polyline points="320,272 320,300 132,300 132,400" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="272" x2="380" y2="400" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="613" y1="272" x2="613" y2="400" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="656,272 656,320 842,320 842,400" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="496" y1="272" x2="496" y2="496" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="140" y="322" font-size="14" fill="#a3a4b8">known route is minimal</text>
  <text x="372" y="352" text-anchor="end" font-size="14" fill="#a3a4b8">only a reduced route</text>
  <text x="624" y="344" font-size="14" fill="#a3a4b8">unresolved may cost less</text>
  <text x="664" y="302" font-size="14" fill="#a3a4b8">no route meets the rules</text>
  <text x="504" y="300" font-size="14" fill="#a3a4b8">yes</text>

  <polyline points="427,560 427,576 253,576 253,592" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="499" y1="560" x2="499" y2="592" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
