<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 712" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Minimum route outcomes</title>
  <desc id="d">One exact search reads the same solver structure and basis as the graph.
  When the exact attempt stays inside the configured size limit, the exact result is the exact
  minimum route, a shortfall, an unresolved route, or no route under the rules. When the attempt
  exceeds the size limit, one greedy restart yields an approximate route or no route found.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="712" rx="12" fill="#232434"/>

  <rect x="380" y="24" width="200" height="40" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="50" text-anchor="middle" font-size="16" fill="#ececf2">Route calculation</text>

  <rect x="290" y="80" width="380" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="106" text-anchor="middle" font-size="16" fill="#ececf2">Exact search</text>
  <text x="480" y="128" text-anchor="middle" font-size="14" fill="#a3a4b8">same structure and basis as the graph</text>

  <rect x="290" y="168" width="380" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="194" text-anchor="middle" font-size="16" fill="#ececf2">Size limit</text>
  <text x="480" y="216" text-anchor="middle" font-size="14" fill="#a3a4b8">exceeded by the exact attempt</text>

  <rect x="360" y="264" width="240" height="40" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="290" text-anchor="middle" font-size="16" fill="#ececf2">Exact result</text>

  <rect x="24" y="424" width="220" height="64" rx="8" fill="#5a1e9c" stroke="#a98ae0" stroke-width="1.5"/>
  <text x="134" y="450" text-anchor="middle" font-size="16" fill="#ececf2">Exact minimum route</text>
  <text x="134" y="472" text-anchor="middle" font-size="14" fill="#ececf2">least new credits</text>

  <rect x="288" y="424" width="192" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="384" y="450" text-anchor="middle" font-size="16" fill="#ececf2">Shortfall</text>
  <text x="384" y="472" text-anchor="middle" font-size="14" fill="#a3a4b8">reduced route only</text>

  <rect x="504" y="424" width="196" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="602" y="450" text-anchor="middle" font-size="16" fill="#ececf2">Route unresolved</text>
  <text x="602" y="472" text-anchor="middle" font-size="14" fill="#a3a4b8">cost may be lower</text>

  <rect x="728" y="424" width="192" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="824" y="450" text-anchor="middle" font-size="16" fill="#ececf2">No route exists</text>
  <text x="824" y="472" text-anchor="middle" font-size="14" fill="#a3a4b8">no valid route</text>

  <rect x="416" y="520" width="160" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="496" y="546" text-anchor="middle" font-size="16" fill="#ececf2">Greedy search</text>
  <text x="496" y="568" text-anchor="middle" font-size="14" fill="#a3a4b8">one restart</text>

  <rect x="160" y="616" width="212" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="266" y="642" text-anchor="middle" font-size="16" fill="#ececf2">Approximate route</text>
  <text x="266" y="664" text-anchor="middle" font-size="14" fill="#a3a4b8">greedy route found</text>

  <rect x="406" y="616" width="212" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="512" y="642" text-anchor="middle" font-size="16" fill="#ececf2">No route found</text>
  <text x="512" y="664" text-anchor="middle" font-size="14" fill="#a3a4b8">found no valid route</text>

  <line x1="480" y1="64" x2="480" y2="80" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="144" x2="480" y2="168" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="232" x2="480" y2="264" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="492" y="250" font-size="14" fill="#a3a4b8">no</text>

  <polyline points="670,192 936,192 936,552 576,552" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="682" y="184" font-size="14" fill="#a3a4b8">yes</text>

  <polyline points="420,304 420,344 134,344 134,424" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="452,304 452,368 384,368 384,424" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="484,304 484,400 602,400 602,424" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="516,304 516,384 824,384 824,424" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>

  <polyline points="480,584 480,600 266,600 266,616" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="512" y1="584" x2="512" y2="616" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
</svg>
