<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Study structure projection</title>
  <desc id="d">The requested roots enter one batch read that loads every module once and shares one
  course-summary map, and version selection takes one official version per root or an explicit
  selection. A root with several candidates and no selection is listed in version_selection_required.
  A read that allows unavailable roots collects a root in unavailable_root_group_ids when its identity
  matches no module, when it has no version for the year, or when its version has no stored rule, and
  every other root is projected as its official rule tree. The report carries the projected roots and
  both identity lists.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="700" rx="12" fill="#232434"/>

  <rect x="360" y="40" width="240" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="66" text-anchor="middle" font-size="16" fill="#ececf2">Requested roots</text>
  <text x="480" y="88" text-anchor="middle" font-size="14" fill="#a3a4b8">one batch per request</text>

  <rect x="360" y="136" width="240" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="162" text-anchor="middle" font-size="16" fill="#ececf2">Shared module read</text>
  <text x="480" y="184" text-anchor="middle" font-size="14" fill="#a3a4b8">one read for the batch</text>

  <rect x="48" y="232" width="224" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="160" y="258" text-anchor="middle" font-size="16" fill="#ececf2">Explicit selection</text>
  <text x="160" y="280" text-anchor="middle" font-size="14" fill="#a3a4b8">optional per group</text>

  <rect x="360" y="232" width="240" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="258" text-anchor="middle" font-size="16" fill="#ececf2">Version selection</text>
  <text x="480" y="280" text-anchor="middle" font-size="14" fill="#a3a4b8">for the configured year</text>

  <rect x="360" y="328" width="240" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="354" text-anchor="middle" font-size="16" fill="#ececf2">Rule tree projection</text>
  <text x="480" y="376" text-anchor="middle" font-size="14" fill="#a3a4b8">shared summary read</text>

  <rect x="48" y="440" width="264" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="180" y="466" text-anchor="middle" font-size="16" fill="#ececf2">Selection required</text>
  <text x="180" y="488" text-anchor="middle" font-size="14" fill="#a3a4b8">no explicit selection</text>

  <rect x="360" y="440" width="240" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="466" text-anchor="middle" font-size="16" fill="#ececf2">Projected roots</text>
  <text x="480" y="488" text-anchor="middle" font-size="14" fill="#a3a4b8">one tree per root</text>

  <rect x="696" y="440" width="216" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="804" y="466" text-anchor="middle" font-size="16" fill="#ececf2">Unavailable roots</text>
  <text x="804" y="488" text-anchor="middle" font-size="14" fill="#a3a4b8">root, version or rule</text>

  <rect x="48" y="536" width="864" height="64" rx="8" fill="#2e3045" stroke="#a98ae0" stroke-width="1.5"/>
  <text x="480" y="562" text-anchor="middle" font-size="16" fill="#ececf2">Structure report</text>
  <text x="480" y="588" text-anchor="middle" font-size="14" fill="#a3a4b8">projected roots, unavailable identities, selection-required identities</text>

  <line x1="480" y1="104" x2="480" y2="136" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="492" y="124" font-size="14" fill="#a3a4b8">every root</text>

  <line x1="480" y1="200" x2="480" y2="232" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="468" y="220" text-anchor="end" font-size="14" fill="#a3a4b8">candidate versions</text>

  <line x1="272" y1="264" x2="360" y2="264" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="282" y="255" font-size="14" fill="#a3a4b8">optional</text>

  <line x1="480" y1="296" x2="480" y2="328" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="480" y1="392" x2="480" y2="440" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="492" y="420" font-size="14" fill="#a3a4b8">projected tree</text>

  <polyline points="440,296 440,312 180,312 180,440" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>

  <polyline points="600,168 624,168 624,408 840,408 840,440" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="632" y="156" font-size="14" fill="#a3a4b8">no module</text>

  <polyline points="600,264 672,264 672,384 760,384 760,440" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="680" y="252" font-size="14" fill="#a3a4b8">no version or rule</text>

  <line x1="180" y1="504" x2="180" y2="536" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="504" x2="480" y2="536" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="804" y1="504" x2="804" y2="536" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="48" y="620" width="280" height="48" rx="8" fill="none" stroke="#4a4c6b" stroke-width="1.5"/>
  <line x1="64" y1="644" x2="104" y2="644" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="116" y="649" font-size="14" fill="#a3a4b8">Optional request input</text>
</svg>
