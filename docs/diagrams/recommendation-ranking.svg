<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 296" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Recommendation ranking</title>
  <desc id="d">The content and learning-outcomes chunks of the basis enter a nearest chunk search,
  whose hits choose the candidates. The pool leaves out the basis courses and the next courses, and
  a centroid prefilter keeps the candidates whose stored centroid reaches the relatedness floor.
  Every kept candidate is then measured over all of its descriptive chunks against the trimmed basis
  profile, a candidate that duplicates one basis course is dropped, the whole-basis overlap reduces
  the score, and the list is ordered by score, then relatedness, then the displayed name and code.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="296" rx="12" fill="#232434"/>

  <rect x="30" y="56" width="184" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="122" y="82" text-anchor="middle" font-size="16" fill="#ececf2">Basis chunks</text>
  <text x="122" y="104" text-anchor="middle" font-size="14" fill="#a3a4b8">content, outcomes</text>

  <rect x="250" y="56" width="184" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="342" y="82" text-anchor="middle" font-size="16" fill="#ececf2">Nearest search</text>
  <text x="342" y="104" text-anchor="middle" font-size="14" fill="#a3a4b8">per basis chunk</text>

  <rect x="470" y="56" width="184" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="562" y="82" text-anchor="middle" font-size="16" fill="#ececf2">Candidate pool</text>
  <text x="562" y="104" text-anchor="middle" font-size="14" fill="#a3a4b8">minus basis, next</text>

  <rect x="690" y="56" width="240" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="810" y="82" text-anchor="middle" font-size="16" fill="#ececf2">Centroid filter</text>
  <text x="810" y="104" text-anchor="middle" font-size="14" fill="#a3a4b8">centroid floor</text>

  <rect x="30" y="200" width="184" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="122" y="226" text-anchor="middle" font-size="16" fill="#ececf2">Relatedness</text>
  <text x="122" y="248" text-anchor="middle" font-size="14" fill="#a3a4b8">all descriptive</text>

  <rect x="250" y="200" width="184" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="342" y="226" text-anchor="middle" font-size="16" fill="#ececf2">Duplicate cut</text>
  <text x="342" y="248" text-anchor="middle" font-size="14" fill="#a3a4b8">per basis course</text>

  <rect x="470" y="200" width="184" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="562" y="226" text-anchor="middle" font-size="16" fill="#ececf2">Overlap penalty</text>
  <text x="562" y="248" text-anchor="middle" font-size="14" fill="#a3a4b8">whole-basis share</text>

  <rect x="690" y="200" width="240" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="810" y="226" text-anchor="middle" font-size="16" fill="#ececf2">Ranked list</text>
  <text x="810" y="248" text-anchor="middle" font-size="14" fill="#a3a4b8">score, relatedness, name</text>

  <line x1="214" y1="88" x2="250" y2="88" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="434" y1="88" x2="470" y2="88" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="654" y1="88" x2="690" y2="88" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="214" y1="232" x2="250" y2="232" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="434" y1="232" x2="470" y2="232" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="654" y1="232" x2="690" y2="232" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polyline points="810,120 810,160 122,160 122,200" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="466" y="152" text-anchor="middle" font-size="14" fill="#a3a4b8">kept hits</text>
</svg>
