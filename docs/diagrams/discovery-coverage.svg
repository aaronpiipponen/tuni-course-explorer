<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 296" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Next-course discovery</title>
  <desc id="d">The chosen basis supplies source identities to candidate discovery, a bounded reverse
  read that returns a candidate set. Each candidate is compiled to its direct prerequisite options,
  and the prerequisite mode decides which candidates are eligible. The eligible candidates carry
  their prerequisite coverage and their inferred dependence into the list, which is ordered for the
  mode.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="296" rx="12" fill="#232434"/>

  <rect x="24" y="56" width="272" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="160" y="82" text-anchor="middle" font-size="16" fill="#ececf2">Basis</text>
  <text x="160" y="104" text-anchor="middle" font-size="14" fill="#a3a4b8">chosen course set</text>

  <rect x="344" y="56" width="272" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="82" text-anchor="middle" font-size="16" fill="#ececf2">Candidate discovery</text>
  <text x="480" y="104" text-anchor="middle" font-size="14" fill="#a3a4b8">bounded reverse read</text>

  <rect x="664" y="56" width="272" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="800" y="82" text-anchor="middle" font-size="16" fill="#ececf2">Direct compilation</text>
  <text x="800" y="104" text-anchor="middle" font-size="14" fill="#a3a4b8">candidate options</text>

  <rect x="24" y="200" width="272" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="160" y="226" text-anchor="middle" font-size="16" fill="#ececf2">Eligibility</text>
  <text x="160" y="248" text-anchor="middle" font-size="14" fill="#a3a4b8">the prerequisite mode</text>

  <rect x="344" y="200" width="272" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="226" text-anchor="middle" font-size="16" fill="#ececf2">Result measures</text>
  <text x="480" y="248" text-anchor="middle" font-size="14" fill="#a3a4b8">coverage, inferred dependence</text>

  <rect x="664" y="200" width="272" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="800" y="226" text-anchor="middle" font-size="16" fill="#ececf2">Ordered list</text>
  <text x="800" y="248" text-anchor="middle" font-size="14" fill="#a3a4b8">name or coverage key</text>

  <line x1="296" y1="88" x2="344" y2="88" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="616" y1="88" x2="664" y2="88" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="296" y1="232" x2="344" y2="232" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="616" y1="232" x2="664" y2="232" stroke="#a3a4b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <polyline points="800,120 800,160 160,160 160,200" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="480" y="152" text-anchor="middle" font-size="14" fill="#a3a4b8">direct options</text>
</svg>
