<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 544" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Inference pipeline</title>
  <desc id="d">Effective text feeds a candidate pool and a rerank, and the packet carries the
  effective text to the local language model. The accent frame marks the label-safe model inputs, which
  exclude official prerequisite structure. Validation reads the model's untrusted output, the proposal
  deduplicates the accepted result against the official prerequisites, which enter only there, and
  publication writes the inferred sets and equivalence groups.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="544" rx="12" fill="#232434"/>

  <rect x="48" y="40" width="864" height="232" rx="12" fill="none" stroke="#a98ae0"
        stroke-width="1.5"/>
  <text x="72" y="66" font-size="16" fill="#a98ae0">Label-safe model inputs</text>

  <rect x="72" y="72" width="240" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="192" y="98" text-anchor="middle" font-size="16" fill="#ececf2">Effective text</text>
  <text x="192" y="120" text-anchor="middle" font-size="14" fill="#a3a4b8">Name, content, outcomes</text>

  <rect x="400" y="72" width="180" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="490" y="98" text-anchor="middle" font-size="16" fill="#ececf2">Candidate pool</text>
  <text x="490" y="120" text-anchor="middle" font-size="14" fill="#a3a4b8">Configured depth</text>

  <rect x="700" y="72" width="188" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="794" y="98" text-anchor="middle" font-size="16" fill="#ececf2">Rerank</text>
  <text x="794" y="120" text-anchor="middle" font-size="14" fill="#a3a4b8">Cross-encoder</text>

  <rect x="72" y="184" width="240" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="192" y="210" text-anchor="middle" font-size="16" fill="#ececf2">Packet</text>
  <text x="192" y="232" text-anchor="middle" font-size="14" fill="#a3a4b8">Identities and text only</text>

  <rect x="400" y="184" width="320" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="560" y="210" text-anchor="middle" font-size="16" fill="#ececf2">Local language model</text>
  <text x="560" y="232" text-anchor="middle" font-size="14" fill="#a3a4b8">Generates one result</text>

  <rect x="48" y="320" width="240" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="168" y="346" text-anchor="middle" font-size="16" fill="#ececf2">Validation</text>
  <text x="168" y="368" text-anchor="middle" font-size="14" fill="#a3a4b8">Untrusted output</text>

  <rect x="400" y="320" width="200" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="500" y="346" text-anchor="middle" font-size="16" fill="#ececf2">Proposal</text>
  <text x="500" y="368" text-anchor="middle" font-size="14" fill="#a3a4b8">Deduplicated</text>

  <rect x="700" y="320" width="212" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="806" y="346" text-anchor="middle" font-size="16" fill="#ececf2">Publication</text>
  <text x="806" y="368" text-anchor="middle" font-size="14" fill="#a3a4b8">Sets and groups</text>

  <rect x="48" y="448" width="240" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="168" y="474" text-anchor="middle" font-size="16" fill="#ececf2">Official prerequisites</text>
  <text x="168" y="496" text-anchor="middle" font-size="14" fill="#a3a4b8">Enter at the proposal</text>

  <rect x="700" y="448" width="212" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="806" y="474" text-anchor="middle" font-size="16" fill="#ececf2">Inferred sets</text>
  <text x="806" y="496" text-anchor="middle" font-size="14" fill="#a3a4b8">Equivalence groups</text>

  <line x1="312" y1="104" x2="400" y2="104" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="580" y1="104" x2="700" y2="104" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <polyline points="794,136 794,160 192,160 192,184" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="312" y1="216" x2="400" y2="216" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <polyline points="560,248 560,288 168,288 168,320" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="288,352 340,352 340,336 400,336" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="352" x2="700" y2="352" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="806" y1="384" x2="806" y2="448" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <polyline points="288,480 384,480 384,376 400,376" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
