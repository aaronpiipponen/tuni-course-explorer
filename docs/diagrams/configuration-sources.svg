<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 608" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Configuration sources and consumers</title>
  <desc id="d">The example templates are copied at setup into the subsystem files and the environment
  file. The settings owner reads the subsystem files and the environment file, which the process
  environment overrides, and hands settings to the web server, the stages and the Compose environment
  file, which feeds Docker Compose. The Administration backend reads its own family from the subsystem
  files in its own process, and a serving artifact build writes the hub pair that the web server
  reads.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a98ae0"/>
    </marker>
  </defs>
  <rect width="960" height="608" rx="12" fill="#232434"/>

  <rect x="48" y="40" width="260" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="178" y="66" text-anchor="middle" font-size="16" fill="#ececf2">Artifact build</text>
  <text x="178" y="88" text-anchor="middle" font-size="14" fill="#a3a4b8">Serving artifact files</text>

  <rect x="48" y="136" width="260" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="178" y="162" text-anchor="middle" font-size="16" fill="#ececf2">Example files</text>
  <text x="178" y="184" text-anchor="middle" font-size="14" fill="#a3a4b8">examples/</text>

  <rect x="48" y="232" width="260" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="178" y="258" text-anchor="middle" font-size="16" fill="#ececf2">Subsystem files</text>
  <text x="178" y="280" text-anchor="middle" font-size="14" fill="#a3a4b8">including admin_web.toml</text>

  <rect x="48" y="328" width="260" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="178" y="354" text-anchor="middle" font-size="16" fill="#ececf2">Administration backend</text>
  <text x="178" y="376" text-anchor="middle" font-size="14" fill="#a3a4b8">Own settings family</text>

  <rect x="48" y="424" width="260" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="178" y="450" text-anchor="middle" font-size="16" fill="#ececf2">Environment file</text>
  <text x="178" y="472" text-anchor="middle" font-size="14" fill="#a3a4b8">.env, credentials</text>

  <rect x="400" y="264" width="180" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="490" y="290" text-anchor="middle" font-size="16" fill="#ececf2">Settings owner</text>
  <text x="490" y="312" text-anchor="middle" font-size="14" fill="#a3a4b8">Composes values</text>

  <rect x="644" y="40" width="268" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="778" y="66" text-anchor="middle" font-size="16" fill="#ececf2">Web server</text>
  <text x="778" y="88" text-anchor="middle" font-size="14" fill="#a3a4b8">Serving settings only</text>

  <rect x="644" y="168" width="268" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="778" y="194" text-anchor="middle" font-size="16" fill="#ececf2">Stages</text>
  <text x="778" y="216" text-anchor="middle" font-size="14" fill="#a3a4b8">Preparation commands</text>

  <rect x="644" y="304" width="268" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="778" y="330" text-anchor="middle" font-size="16" fill="#ececf2">Compose environment file</text>
  <text x="778" y="352" text-anchor="middle" font-size="14" fill="#a3a4b8">Generated per Compose run</text>

  <rect x="644" y="432" width="268" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="778" y="458" text-anchor="middle" font-size="16" fill="#ececf2">Docker Compose</text>
  <text x="778" y="480" text-anchor="middle" font-size="14" fill="#a3a4b8">Reads the generated file</text>

  <line x1="178" y1="200" x2="178" y2="232" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="178" y1="296" x2="178" y2="328" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <polyline points="48,168 32,168 32,456 48,456" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <polyline points="308,264 320,264 320,280 400,280" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="308,440 348,440 348,312 400,312" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>

  <polyline points="308,56 644,56" fill="none" stroke="#a3a4b8" stroke-width="1.5"
            marker-end="url(#arrow)"/>
  <text x="480" y="80" font-size="14" fill="#a3a4b8">hub pair</text>

  <polyline points="580,264 590,264 590,88 644,88" fill="none" stroke="#a98ae0"
            stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <polyline points="580,296 612,296 612,200 644,200" fill="none" stroke="#a98ae0"
            stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <line x1="580" y1="328" x2="644" y2="328" stroke="#a98ae0" stroke-width="1.5"
        marker-end="url(#arrow-accent)"/>
  <line x1="778" y1="368" x2="778" y2="432" stroke="#a98ae0" stroke-width="1.5"
        marker-end="url(#arrow-accent)"/>

  <rect x="48" y="528" width="252" height="48" rx="8" fill="none" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <line x1="64" y1="552" x2="104" y2="552" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="116" y="557" font-size="14" fill="#a3a4b8">Copied at setup</text>
</svg>
