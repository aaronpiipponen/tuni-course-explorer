<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 616" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Configuration sources and consumers</title>
  <desc id="d">Example files are copied at setup into the subsystem files and the hub files. The
  settings owner reads the subsystem files, including the administration backend's
  config/admin_web.toml, the hub files, the environment file, and the process environment. It hands
  settings to the stages, the web server, the administration backend, and the Compose environment
  file, which feeds Docker Compose.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a98ae0"/>
    </marker>
  </defs>
  <rect width="960" height="616" rx="12" fill="#232434"/>

  <rect x="64" y="40" width="220" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="174" y="66" text-anchor="middle" font-size="16" fill="#ececf2">Example files</text>
  <text x="174" y="88" text-anchor="middle" font-size="14" fill="#a3a4b8">examples/</text>

  <rect x="64" y="140" width="220" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="174" y="166" text-anchor="middle" font-size="16" fill="#ececf2">Subsystem files</text>
  <text x="174" y="188" text-anchor="middle" font-size="14" fill="#a3a4b8">with admin_web.toml</text>

  <rect x="64" y="236" width="220" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="174" y="262" text-anchor="middle" font-size="16" fill="#ececf2">Hub files</text>
  <text x="174" y="284" text-anchor="middle" font-size="14" fill="#a3a4b8">config/derived/</text>

  <rect x="64" y="332" width="220" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="174" y="358" text-anchor="middle" font-size="16" fill="#ececf2">Environment file</text>
  <text x="174" y="380" text-anchor="middle" font-size="14" fill="#a3a4b8">.env</text>

  <rect x="64" y="428" width="220" height="40" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="174" y="454" text-anchor="middle" font-size="16" fill="#ececf2">Process environment</text>

  <rect x="362" y="246" width="200" height="128" rx="8" fill="#2e3045"
        stroke="#a98ae0" stroke-width="1.5"/>
  <text x="462" y="300" text-anchor="middle" font-size="16" fill="#ececf2">Settings owner</text>
  <text x="462" y="322" text-anchor="middle" font-size="14" fill="#a3a4b8">Composes the values</text>

  <rect x="640" y="140" width="256" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="768" y="166" text-anchor="middle" font-size="16" fill="#ececf2">Stages</text>
  <text x="768" y="188" text-anchor="middle" font-size="14" fill="#a3a4b8">Preparation commands</text>

  <rect x="640" y="236" width="256" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="768" y="262" text-anchor="middle" font-size="16" fill="#ececf2">Web server</text>
  <text x="768" y="284" text-anchor="middle" font-size="14" fill="#a3a4b8">Serving settings only</text>

  <rect x="640" y="332" width="256" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="768" y="358" text-anchor="middle" font-size="16" fill="#ececf2">Administration backend</text>
  <text x="768" y="380" text-anchor="middle" font-size="14" fill="#a3a4b8">Commands and settings</text>

  <rect x="640" y="428" width="256" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="768" y="454" text-anchor="middle" font-size="16" fill="#ececf2">Compose environment file</text>
  <text x="768" y="476" text-anchor="middle" font-size="14" fill="#a3a4b8">Generated per Compose run</text>

  <rect x="640" y="524" width="256" height="40" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="768" y="550" text-anchor="middle" font-size="16" fill="#ececf2">Docker Compose</text>

  <line x1="174" y1="104" x2="174" y2="140" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <polyline points="64,72 48,72 48,268 64,268" fill="none" stroke="#a3a4b8" stroke-width="1.5"
            stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <polyline points="284,172 293,172 293,262 362,262" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="284,268 313,268 313,294 362,294" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="284,364 333,364 333,326 362,326" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="284,448 353,448 353,358 362,358" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>

  <polyline points="562,262 571,262 571,172 640,172" fill="none" stroke="#a98ae0"
            stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <polyline points="562,294 591,294 591,268 640,268" fill="none" stroke="#a98ae0"
            stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <polyline points="562,326 631,326 631,364 640,364" fill="none" stroke="#a98ae0"
            stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <polyline points="562,358 611,358 611,460 640,460" fill="none" stroke="#a98ae0"
            stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <line x1="768" y1="492" x2="768" y2="524" stroke="#a98ae0" stroke-width="1.5"
        marker-end="url(#arrow-accent)"/>

  <rect x="64" y="536" width="252" height="48" rx="8" fill="none" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <line x1="80" y1="560" x2="120" y2="560" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="132" y="565" font-size="14" fill="#a3a4b8">Copied at setup</text>
</svg>
