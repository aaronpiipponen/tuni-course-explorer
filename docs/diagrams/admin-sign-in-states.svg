<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 424" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Administration session and lock states</title>
  <desc id="d">An anonymous session becomes a signed-in session on a correct sign-in, and the
  signed-in session expires after its idle or total lifetime. An expired session is dropped when its
  cookie is next resolved, and the next GET /auth/session creates an anonymous session. Failed
  sign-ins accumulate in the failed-attempt count, a correct sign-in after one or two failures signs
  in and resets the count, and the third consecutive failure creates the administration lock.
  Deleting the lock file lets a signed-in session within its lifetime work again.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a98ae0"/>
    </marker>
  </defs>
  <rect width="960" height="424" rx="12" fill="#232434"/>

  <rect x="48" y="88" width="210" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="153" y="114" text-anchor="middle" font-size="16" fill="#ececf2">Anonymous session</text>
  <text x="153" y="136" text-anchor="middle" font-size="14" fill="#a3a4b8">No console access</text>

  <rect x="375" y="88" width="210" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="114" text-anchor="middle" font-size="16" fill="#ececf2">Signed-in session</text>
  <text x="480" y="136" text-anchor="middle" font-size="14" fill="#a3a4b8">The console tabs</text>

  <rect x="702" y="88" width="210" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="807" y="114" text-anchor="middle" font-size="16" fill="#ececf2">Expired session</text>
  <text x="807" y="136" text-anchor="middle" font-size="14" fill="#a3a4b8">Idle or total limit</text>

  <rect x="48" y="312" width="300" height="64" rx="8" fill="#2e3045"
        stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="198" y="338" text-anchor="middle" font-size="16" fill="#ececf2">Failed attempts 1 or 2</text>
  <text x="198" y="360" text-anchor="middle" font-size="14" fill="#a3a4b8">Consecutive failures</text>

  <rect x="612" y="312" width="300" height="64" rx="8" fill="#2e3045"
        stroke="#a98ae0" stroke-width="1.5"/>
  <text x="762" y="338" text-anchor="middle" font-size="16" fill="#ececf2">Administration lock</text>
  <text x="762" y="360" text-anchor="middle" font-size="14" fill="#a3a4b8">Every request refused</text>

  <line x1="258" y1="120" x2="375" y2="120" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="266" y="110" font-size="14" fill="#a3a4b8">sign-in</text>

  <line x1="585" y1="120" x2="702" y2="120" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="613" y="110" font-size="14" fill="#a3a4b8">expires</text>

  <line x1="153" y1="152" x2="153" y2="312" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="165" y="240" font-size="14" fill="#a3a4b8">failed sign-in</text>

  <line x1="348" y1="344" x2="612" y2="344" stroke="#a98ae0" stroke-width="1.5"
        marker-end="url(#arrow-accent)"/>
  <text x="480" y="332" text-anchor="middle" font-size="14" fill="#a3a4b8">third consecutive failure</text>

  <polyline points="300,312 300,206 480,206 480,152" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="312" y="228" font-size="14" fill="#a3a4b8">correct sign-in resets the count</text>

  <polyline points="807,88 807,48 100,48 100,88" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="430" y="70" text-anchor="middle" font-size="14" fill="#a3a4b8">next GET /auth/session</text>

  <polyline points="762,312 762,176 520,176 520,152" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="770" y="240" font-size="14" fill="#a3a4b8">file deleted</text>
</svg>
