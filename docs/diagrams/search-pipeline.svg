<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Search pipeline</title>
  <desc id="d">One query reaches the four search methods. The query text goes to the embedding
  service, which supplies the query vector that the semantic method measures. The results of the four
  methods are merged into one entry per course, ordered by the configured method precedence, and every
  match is returned without a result-count limit.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a98ae0"/>
    </marker>
  </defs>
  <rect width="960" height="560" rx="12" fill="#232434"/>

  <rect x="48" y="160" width="200" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="148" y="186" text-anchor="middle" font-size="16" fill="#ececf2">Query</text>
  <text x="148" y="208" text-anchor="middle" font-size="14" fill="#a3a4b8">one request</text>

  <rect x="48" y="400" width="200" height="64" rx="8" fill="#2e3045" stroke="#a98ae0"
        stroke-width="1.5"/>
  <text x="148" y="426" text-anchor="middle" font-size="16" fill="#ececf2">Embedding service</text>
  <text x="148" y="448" text-anchor="middle" font-size="14" fill="#a3a4b8">embeds the query</text>

  <rect x="380" y="64" width="200" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="480" y="90" text-anchor="middle" font-size="16" fill="#ececf2">Exact code</text>
  <text x="480" y="112" text-anchor="middle" font-size="14" fill="#a3a4b8">official code</text>

  <rect x="380" y="160" width="200" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="480" y="186" text-anchor="middle" font-size="16" fill="#ececf2">Substring</text>
  <text x="480" y="208" text-anchor="middle" font-size="14" fill="#a3a4b8">name or code</text>

  <rect x="380" y="256" width="200" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="480" y="282" text-anchor="middle" font-size="16" fill="#ececf2">Fuzzy search</text>
  <text x="480" y="304" text-anchor="middle" font-size="14" fill="#a3a4b8">0 to 100</text>

  <rect x="380" y="352" width="200" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="480" y="378" text-anchor="middle" font-size="16" fill="#ececf2">Semantic</text>
  <text x="480" y="400" text-anchor="middle" font-size="14" fill="#a3a4b8">centred cosine</text>

  <rect x="680" y="160" width="232" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="796" y="186" text-anchor="middle" font-size="16" fill="#ececf2">Merge by course</text>
  <text x="796" y="208" text-anchor="middle" font-size="14" fill="#a3a4b8">one entry each</text>

  <rect x="680" y="368" width="232" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="796" y="394" text-anchor="middle" font-size="16" fill="#ececf2">Tier order</text>
  <text x="796" y="416" text-anchor="middle" font-size="14" fill="#a3a4b8">method precedence</text>

  <rect x="680" y="464" width="232" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="796" y="490" text-anchor="middle" font-size="16" fill="#ececf2">Results</text>
  <text x="796" y="512" text-anchor="middle" font-size="14" fill="#a3a4b8">all matches, no limit</text>

  <line x1="248" y1="192" x2="272" y2="192" stroke="#a3a4b8" stroke-width="1.5"/>
  <line x1="272" y1="96" x2="272" y2="384" stroke="#a3a4b8" stroke-width="1.5"/>
  <line x1="272" y1="96" x2="380" y2="96" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="272" y1="192" x2="380" y2="192" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="272" y1="288" x2="380" y2="288" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="272" y1="384" x2="380" y2="384" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <line x1="148" y1="224" x2="148" y2="400" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="158" y="344" font-size="14" fill="#a3a4b8">query text</text>

  <polyline points="248,432 360,432 360,400 380,400" fill="none" stroke="#a98ae0"
            stroke-width="1.5" marker-end="url(#arrow-accent)"/>

  <line x1="580" y1="96" x2="652" y2="96" stroke="#a3a4b8" stroke-width="1.5"/>
  <line x1="580" y1="192" x2="652" y2="192" stroke="#a3a4b8" stroke-width="1.5"/>
  <line x1="580" y1="288" x2="652" y2="288" stroke="#a3a4b8" stroke-width="1.5"/>
  <line x1="580" y1="384" x2="652" y2="384" stroke="#a3a4b8" stroke-width="1.5"/>
  <line x1="652" y1="96" x2="652" y2="384" stroke="#a3a4b8" stroke-width="1.5"/>
  <line x1="652" y1="192" x2="680" y2="192" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <line x1="796" y1="320" x2="796" y2="368" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="796" y1="432" x2="796" y2="464" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
</svg>
