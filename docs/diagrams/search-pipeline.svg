<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Search pipeline</title>
  <desc id="d">One query reaches the four search methods. The embedding service supplies the query
  vector that the semantic method measures. The results of the four methods are merged into one entry
  per course and ordered by the configured tier order into the results list.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a98ae0"/>
    </marker>
  </defs>
  <rect width="960" height="480" rx="12" fill="#232434"/>

  <rect x="40" y="96" width="200" height="128" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="140" y="156" text-anchor="middle" font-size="16" fill="#ececf2">Query</text>
  <text x="140" y="178" text-anchor="middle" font-size="14" fill="#a3a4b8">one request</text>

  <rect x="40" y="384" width="200" height="64" rx="8" fill="#2e3045" stroke="#a98ae0"
        stroke-width="1.5"/>
  <text x="140" y="410" text-anchor="middle" font-size="16" fill="#ececf2">Embedding service</text>
  <text x="140" y="432" text-anchor="middle" font-size="14" fill="#a3a4b8">embeds the query</text>

  <rect x="320" y="80" width="170" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="405" y="106" text-anchor="middle" font-size="16" fill="#ececf2">Exact code</text>
  <text x="405" y="128" text-anchor="middle" font-size="14" fill="#a3a4b8">official code</text>

  <rect x="320" y="176" width="170" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="405" y="202" text-anchor="middle" font-size="16" fill="#ececf2">Substring</text>
  <text x="405" y="224" text-anchor="middle" font-size="14" fill="#a3a4b8">name or code</text>

  <rect x="320" y="272" width="170" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="405" y="298" text-anchor="middle" font-size="16" fill="#ececf2">Fuzzy search</text>
  <text x="405" y="320" text-anchor="middle" font-size="14" fill="#a3a4b8">0 to 100</text>

  <rect x="320" y="368" width="170" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="405" y="394" text-anchor="middle" font-size="16" fill="#ececf2">Semantic</text>
  <text x="405" y="416" text-anchor="middle" font-size="14" fill="#a3a4b8">centred cosine</text>

  <rect x="570" y="88" width="180" height="152" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="660" y="160" text-anchor="middle" font-size="16" fill="#ececf2">Merge by course</text>
  <text x="660" y="182" text-anchor="middle" font-size="14" fill="#a3a4b8">one entry each</text>

  <rect x="570" y="312" width="180" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="660" y="338" text-anchor="middle" font-size="16" fill="#ececf2">Tier order</text>
  <text x="660" y="360" text-anchor="middle" font-size="14" fill="#a3a4b8">active first</text>

  <rect x="790" y="312" width="140" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b"
        stroke-width="1.5"/>
  <text x="860" y="338" text-anchor="middle" font-size="16" fill="#ececf2">Results</text>
  <text x="860" y="360" text-anchor="middle" font-size="14" fill="#a3a4b8">every course</text>

  <line x1="240" y1="112" x2="320" y2="112" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <polyline points="240,144 296,144 296,208 320,208" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="240,176 276,176 276,304 320,304" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="240,208 256,208 256,384 320,384" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="240" y1="416" x2="320" y2="416" stroke="#a98ae0" stroke-width="1.5"
        marker-end="url(#arrow-accent)"/>

  <polyline points="490,112 500,112 500,104 570,104" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="490,208 520,208 520,144 570,144" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="490,304 540,304 540,184 570,184" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="490,400 560,400 560,224 570,224" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="660" y1="240" x2="660" y2="312" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="750" y1="344" x2="790" y2="344" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
</svg>
