<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Two identity spaces joined by support bindings</title>
  <desc id="d">Two calculation pieces hold the same children in different order, so they have different
  identities and two support bindings. Both bindings point at the one display piece for the course,
  which is keyed by the course owner and the drawing fingerprint.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="320" rx="12" fill="#232434"/>

  <text x="48" y="60" font-size="16" fill="#a3a4b8">Calculation identity</text>
  <text x="356" y="60" font-size="16" fill="#a3a4b8">Bindings</text>
  <text x="684" y="60" font-size="16" fill="#a3a4b8">Display identity</text>

  <rect x="48" y="88" width="272" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="184" y="114" text-anchor="middle" font-size="16" fill="#ececf2">Calculation piece</text>
  <text x="184" y="136" text-anchor="middle" font-size="14" fill="#a3a4b8">ordered child pieces</text>

  <rect x="48" y="200" width="272" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="184" y="226" text-anchor="middle" font-size="16" fill="#ececf2">Calculation piece</text>
  <text x="184" y="248" text-anchor="middle" font-size="14" fill="#a3a4b8">another child order</text>

  <rect x="356" y="88" width="264" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="488" y="114" text-anchor="middle" font-size="16" fill="#ececf2">Support binding</text>
  <text x="488" y="136" text-anchor="middle" font-size="14" fill="#a3a4b8">s: owner and p: piece</text>

  <rect x="356" y="200" width="264" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="488" y="226" text-anchor="middle" font-size="16" fill="#ececf2">Support binding</text>
  <text x="488" y="248" text-anchor="middle" font-size="14" fill="#a3a4b8">s: owner and p: piece</text>

  <rect x="684" y="144" width="228" height="64" rx="8"
        fill="#2e3045" stroke="#a98ae0" stroke-width="1.5"/>
  <text x="798" y="170" text-anchor="middle" font-size="16" fill="#ececf2">Display piece</text>
  <text x="798" y="192" text-anchor="middle" font-size="14" fill="#a3a4b8">owner and fingerprint</text>

  <line x1="320" y1="120" x2="356" y2="120" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="320" y1="232" x2="356" y2="232" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <polyline points="620,120 648,120 648,164 684,164" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="620,232 648,232 648,188 684,188" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
