<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 576" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Admission control</title>
  <desc id="d">A POST to a fixed catalogue API path receives an admission class. A free read passes
  to the least busy worker process without a check. A light read takes the cookie's light limits,
  and a heavy read takes the cookie's heavy budget and then a global slot from the queue. A read
  that fails a check answers 429 with a Retry-After header and reaches no worker process, an
  admitted read runs on a worker process, and the front router appends one request record for every
  HTTP request.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
  </defs>
  <rect width="960" height="576" rx="12" fill="#232434"/>

  <rect x="104" y="40" width="200" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="204" y="66" text-anchor="middle" font-size="16" fill="#ececf2">API request</text>
  <text x="204" y="88" text-anchor="middle" font-size="14" fill="#a3a4b8">one catalogue path</text>

  <rect x="712" y="40" width="200" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="812" y="66" text-anchor="middle" font-size="16" fill="#ececf2">Request record</text>
  <text x="812" y="88" text-anchor="middle" font-size="14" fill="#a3a4b8">one per request</text>

  <rect x="104" y="144" width="584" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="396" y="170" text-anchor="middle" font-size="16" fill="#ececf2">Admission class</text>
  <text x="396" y="192" text-anchor="middle" font-size="14" fill="#a3a4b8">free, light or heavy</text>

  <rect x="104" y="248" width="224" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="216" y="274" text-anchor="middle" font-size="16" fill="#ececf2">Light limits</text>
  <text x="216" y="296" text-anchor="middle" font-size="14" fill="#a3a4b8">rate and concurrency</text>

  <rect x="464" y="248" width="224" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="576" y="274" text-anchor="middle" font-size="16" fill="#ececf2">Heavy budget</text>
  <text x="576" y="296" text-anchor="middle" font-size="14" fill="#a3a4b8">per cookie and window</text>

  <rect x="464" y="344" width="224" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="576" y="370" text-anchor="middle" font-size="16" fill="#ececf2">Heavy slots</text>
  <text x="576" y="392" text-anchor="middle" font-size="14" fill="#a3a4b8">slots and queue</text>

  <rect x="104" y="464" width="280" height="64" rx="8"
        fill="#2e3045" stroke="#a98ae0" stroke-width="1.5"/>
  <text x="244" y="490" text-anchor="middle" font-size="16" fill="#ececf2">Worker process</text>
  <text x="244" y="512" text-anchor="middle" font-size="14" fill="#a3a4b8">least busy</text>

  <rect x="720" y="344" width="192" height="64" rx="8"
        fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="816" y="370" text-anchor="middle" font-size="16" fill="#ececf2">Refused</text>
  <text x="816" y="392" text-anchor="middle" font-size="14" fill="#a3a4b8">429, Retry-After</text>

  <line x1="204" y1="104" x2="204" y2="144" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="212" y="132" font-size="14" fill="#a3a4b8">classifies</text>

  <line x1="304" y1="72" x2="712" y2="72" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <text x="320" y="60" font-size="14" fill="#a3a4b8">every request</text>

  <polyline points="104,176 48,176 48,496 104,496" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="56" y="240" font-size="14" fill="#a3a4b8">free, no check</text>

  <line x1="216" y1="208" x2="216" y2="248" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="224" y="236" font-size="14" fill="#a3a4b8">light</text>

  <line x1="576" y1="208" x2="576" y2="248" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="584" y="236" font-size="14" fill="#a3a4b8">heavy</text>

  <line x1="576" y1="312" x2="576" y2="344" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="216" y1="312" x2="216" y2="464" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>

  <polyline points="104,280 80,280 80,544 704,544 704,392 720,392" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>

  <polyline points="688,280 800,280 800,344" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="688" y1="360" x2="720" y2="360" stroke="#a3a4b8"
        stroke-width="1.5" marker-end="url(#arrow)"/>

  <polyline points="464,376 424,376 424,480 384,480" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
