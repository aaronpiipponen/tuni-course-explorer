<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Embedding generation</title>
  <desc id="d">The effective text is split into overlapping chunks. A run reconciles the
  desired chunks with the stored chunks: matching chunks are reused in place, pending chunks go to
  the embedding service, and obsolete chunks are deleted. The chunk store of the selected dataset
  holds every chunk with its vector, and the administration hub command computes the hub files from
  those vectors.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a98ae0"/>
    </marker>
  </defs>
  <rect width="960" height="432" rx="12" fill="#232434"/>

  <rect x="40" y="128" width="150" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="115" y="154" text-anchor="middle" font-size="15" fill="#ececf2">Teaching text</text>
  <text x="115" y="176" text-anchor="middle" font-size="14" fill="#a3a4b8">effective</text>

  <rect x="210" y="128" width="130" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="275" y="154" text-anchor="middle" font-size="15" fill="#ececf2">Chunking</text>
  <text x="275" y="176" text-anchor="middle" font-size="14" fill="#a3a4b8">overlap</text>

  <rect x="380" y="96" width="130" height="128" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="445" y="154" text-anchor="middle" font-size="15" fill="#ececf2">Reconcile</text>
  <text x="445" y="176" text-anchor="middle" font-size="14" fill="#a3a4b8">with stored</text>

  <rect x="580" y="40" width="190" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="675" y="66" text-anchor="middle" font-size="15" fill="#ececf2">Matching chunks</text>
  <text x="675" y="88" text-anchor="middle" font-size="14" fill="#a3a4b8">reused in place</text>

  <rect x="580" y="128" width="190" height="64" rx="8" fill="#2e3045" stroke="#a98ae0" stroke-width="1.5"/>
  <text x="675" y="154" text-anchor="middle" font-size="15" fill="#ececf2">Embedding service</text>
  <text x="675" y="176" text-anchor="middle" font-size="14" fill="#a3a4b8">pending chunks</text>

  <rect x="580" y="224" width="190" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="675" y="250" text-anchor="middle" font-size="15" fill="#ececf2">Obsolete chunks</text>
  <text x="675" y="272" text-anchor="middle" font-size="14" fill="#a3a4b8">deleted</text>

  <rect x="790" y="104" width="146" height="88" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="863" y="142" text-anchor="middle" font-size="15" fill="#ececf2">Chunk store</text>
  <text x="863" y="164" text-anchor="middle" font-size="14" fill="#a3a4b8">vectors</text>

  <rect x="790" y="240" width="146" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="863" y="266" text-anchor="middle" font-size="15" fill="#ececf2">Hub files</text>
  <text x="863" y="288" text-anchor="middle" font-size="14" fill="#a3a4b8">admin hubs</text>

  <line x1="190" y1="160" x2="210" y2="160" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="340" y1="160" x2="380" y2="160" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <polyline points="510,112 525,112 525,72 580,72" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="510" y1="160" x2="580" y2="160" stroke="#a98ae0" stroke-width="1.5"
        marker-end="url(#arrow-accent)"/>
  <polyline points="510,208 555,208 555,256 580,256" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>

  <polyline points="770,72 780,72 780,128 790,128" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="160" x2="790" y2="160" stroke="#a98ae0" stroke-width="1.5"
        marker-end="url(#arrow-accent)"/>

  <line x1="863" y1="192" x2="863" y2="240" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <rect x="40" y="352" width="296" height="48" rx="8" fill="none" stroke="#4a4c6b" stroke-width="1.5"/>
  <line x1="56" y1="376" x2="96" y2="376" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="108" y="381" font-size="14" fill="#a3a4b8">Computed from the vectors</text>
</svg>
