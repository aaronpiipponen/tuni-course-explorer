<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img"
     aria-labelledby="t d" font-family="system-ui, sans-serif">
  <title id="t">Embedding generation</title>
  <desc id="d">The effective teaching text of each representative version is split into overlapping
  chunks. A run reconciles the desired chunks with the stored chunks: matching chunks are reused in
  place, pending chunks go to the embedding service, and obsolete chunks are deleted. The chunk store
  of a dataset holds every chunk with its vector, and the serving artifact build of that dataset
  computes the authoritative hub pair from the stored vectors.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a4b8"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a98ae0"/>
    </marker>
  </defs>
  <rect width="960" height="600" rx="12" fill="#232434"/>

  <rect x="400" y="40" width="160" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="66" text-anchor="middle" font-size="16" fill="#ececf2">Teaching text</text>
  <text x="480" y="88" text-anchor="middle" font-size="14" fill="#a3a4b8">effective</text>

  <rect x="400" y="136" width="160" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="162" text-anchor="middle" font-size="16" fill="#ececf2">Chunking</text>
  <text x="480" y="184" text-anchor="middle" font-size="14" fill="#a3a4b8">overlap</text>

  <rect x="400" y="232" width="160" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="258" text-anchor="middle" font-size="16" fill="#ececf2">Reconcile</text>
  <text x="480" y="280" text-anchor="middle" font-size="14" fill="#a3a4b8">with stored</text>

  <rect x="40" y="328" width="200" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="140" y="354" text-anchor="middle" font-size="16" fill="#ececf2">Matching chunks</text>
  <text x="140" y="376" text-anchor="middle" font-size="14" fill="#a3a4b8">reused in place</text>

  <rect x="380" y="328" width="200" height="64" rx="8" fill="#2e3045" stroke="#a98ae0" stroke-width="1.5"/>
  <text x="480" y="354" text-anchor="middle" font-size="16" fill="#ececf2">Embedding service</text>
  <text x="480" y="376" text-anchor="middle" font-size="14" fill="#a3a4b8">pending chunks</text>

  <rect x="720" y="328" width="200" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="820" y="354" text-anchor="middle" font-size="16" fill="#ececf2">Obsolete chunks</text>
  <text x="820" y="376" text-anchor="middle" font-size="14" fill="#a3a4b8">deleted</text>

  <rect x="350" y="424" width="260" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="480" y="450" text-anchor="middle" font-size="16" fill="#ececf2">Chunk store</text>
  <text x="480" y="472" text-anchor="middle" font-size="14" fill="#a3a4b8">of one dataset</text>

  <rect x="660" y="424" width="260" height="64" rx="8" fill="#2e3045" stroke="#4a4c6b" stroke-width="1.5"/>
  <text x="790" y="450" text-anchor="middle" font-size="16" fill="#ececf2">Serving artifact build</text>
  <text x="790" y="472" text-anchor="middle" font-size="14" fill="#a3a4b8">that dataset's hub pair</text>

  <line x1="480" y1="104" x2="480" y2="136" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="480" y1="200" x2="480" y2="232" stroke="#a3a4b8" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <polyline points="440,296 440,312 140,312 140,328" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="296" x2="480" y2="328" stroke="#a98ae0" stroke-width="1.5"
        marker-end="url(#arrow-accent)"/>
  <polyline points="520,296 520,312 820,312 820,328" fill="none" stroke="#a3a4b8"
            stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="480" y1="392" x2="480" y2="424" stroke="#a98ae0" stroke-width="1.5"
        marker-end="url(#arrow-accent)"/>

  <line x1="610" y1="456" x2="660" y2="456" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <rect x="40" y="520" width="296" height="48" rx="8" fill="none" stroke="#4a4c6b" stroke-width="1.5"/>
  <line x1="56" y1="544" x2="96" y2="544" stroke="#a3a4b8" stroke-width="1.5"
        stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="108" y="549" font-size="14" fill="#a3a4b8">Computed from the vectors</text>
</svg>
