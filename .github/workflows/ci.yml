# Verify every push to main and every pull request that targets it, then deploy a tested push
# from this server.
#
# The verify job runs on a GitHub-hosted runner. It installs the locked Python and Node
# dependencies, builds the three native serving libraries and the test-only fixture library, and
# runs the lint, format and diff checks and the network-free Python suite. It then copies the
# committed example configuration into the runtime paths inside the checkout, runs both frontend
# gates, builds the extension database image and starts its `db` service, runs the PostgreSQL
# integration selection and the browser journeys against the built app and disposable example
# data, and removes the database service.
#
# The deploy job runs on the repository's self-hosted runner after verify succeeds. It admits
# the serving checkout in its own run block, then runs `deploy/deploy.sh` on the admitted
# commit. That script builds the extension database image, recreates the `db` service, builds
# the native serving libraries, migrates the selected dataset or the configured raw database,
# builds its artifacts, builds both frontends, restarts the two serving units, checks their
# loopback listeners and HTTP answers, and prunes the superseded artifact builds. The job
# checks out nothing and pulls nothing.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    # The venv must come from the distribution interpreter, which carries
    # os.memfd_create; the pinned .python-version names the uv-managed build.
    env:
      UV_PYTHON: /usr/bin/python3.14
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
          clean: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.11.3'
          enable-cache: false
      - name: Install Python
        # The standalone build that uv downloads targets an old glibc and lacks
        # os.memfd_create, which the shared caches need, so the run installs the
        # distribution build and proves the capability before anything uses it.
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.14 python3.14-dev libpq5 libstdc++6
          python3.14 -c 'import os, sys; assert sys.version_info[:2] == (3, 14); fd = os.memfd_create("ci-preflight", os.MFD_CLOEXEC); os.close(fd)'
      - name: Install Python dependencies
        run: uv sync --locked --no-managed-python --python /usr/bin/python3.14
      - name: Build native serving libraries
        # The native test contract fails loudly when a serving library is absent, so every hosted
        # run builds the three serving libraries and the test-only fixture library first.
        run: ./.venv/bin/python scripts/build_native.py --fixtures --non-interactive
      - name: Install web dependencies
        run: npm --prefix web ci --no-audit --no-fund
      - name: Install administration console dependencies
        run: npm --prefix admin-web ci --no-audit --no-fund
      - name: uv run ruff check .
        run: uv run ruff check .
      - name: uv run ruff format --check .
        run: uv run ruff format --check .
      - name: git diff --check HEAD^ HEAD
        run: git diff --check HEAD^ HEAD
      - name: uv run pytest
        run: uv run pytest
      - name: Materialize example configuration
        # The checks read runtime configuration and a Compose file copied from the committed
        # example tree into the runner's working copy.
        run: |
          mkdir -p config
          cp examples/config/*.toml config/
          cp examples/config/wiki.json config/wiki.json
          cp examples/config/feedback-form.json config/feedback-form.json
          cp examples/docker-compose.yml docker-compose.yml
      - name: npm --prefix web run typecheck
        run: npm --prefix web run typecheck
      - name: npm --prefix web run test
        run: npm --prefix web run test
      - name: npm --prefix web run format:check
        run: npm --prefix web run format:check
      - name: npm --prefix web run build
        run: npm --prefix web run build
      - name: npm --prefix admin-web run typecheck
        run: npm --prefix admin-web run typecheck
      - name: npm --prefix admin-web run test
        run: npm --prefix admin-web run test
      - name: npm --prefix admin-web run format:check
        run: npm --prefix admin-web run format:check
      - name: npm --prefix admin-web run build
        run: npm --prefix admin-web run build
      - name: Build the extension database image
        env: &database_environment
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: course_explorer_test
          COMPOSE_PROJECT_NAME: course-explorer-ci
        run: uv run python -m course_explorer_admin.compose --non-interactive -- build db
      - name: uv run python -m course_explorer_admin.compose --non-interactive -- up -d --wait db
        env: *database_environment
        run: uv run python -m course_explorer_admin.compose --non-interactive -- up -d --wait db
      - name: uv run pytest -m "integration and not slow and not live" tests
        env: *database_environment
        run: uv run pytest -m "integration and not slow and not live" tests
      - name: npm --prefix web run browser:install
        run: npm --prefix web run browser:install
      - name: npm --prefix web run browser:test
        env: *database_environment
        run: npm --prefix web run browser:test
      - name: uv run python -m course_explorer_admin.compose --non-interactive -- down --volumes
        if: always()
        env: *database_environment
        run: uv run python -m course_explorer_admin.compose --non-interactive -- down --volumes

  deploy:
    needs: verify
    if: github.repository == 'aaronpiipponen/tuni-course-explorer' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ARM64, tuni-deploy]
    concurrency:
      # One deployment at a time. A newer push cancels its superseded verification and
      # leaves an admitted deployment to finish its two restarts.
      group: serving-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy the tested commit
        working-directory: ${{ vars.SERVING_CHECKOUT }}
        env:
          TESTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Admission runs before any file of the serving checkout executes. An ordinary
          # refusal exits zero and leaves both units as they are.
          if ! [[ "$TESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid tested commit" >&2
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          branch_status=0
          branch="$(git symbolic-ref --quiet --short HEAD 2>/dev/null)" || branch_status=$?
          if (( branch_status > 1 )); then
            echo "checkout Git metadata is unreadable" >&2
            exit 1
          fi
          if (( branch_status == 1 )) || [[ "$branch" != main ]]; then
            echo "not deployed: checkout is not on main"
            exit 0
          fi
          if [[ "$head_commit" != "$TESTED_COMMIT" ]]; then
            echo "not deployed: checkout is not at tested commit"
            exit 0
          fi
          checkout_status="$(git status --porcelain --untracked-files=normal)"
          if [[ -n "$checkout_status" ]]; then
            echo "not deployed: checkout is dirty"
            exit 0
          fi
          bash deploy/deploy.sh "$TESTED_COMMIT"
