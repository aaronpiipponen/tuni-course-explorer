[project]
name = "course-explorer"
version = "0.1.0"
description = "Tampere University curriculum ingestion and course exploration services."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "httpx>=0.28.1",
    "fastapi>=0.115.0,<0.120",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.6",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["course_explorer", "course_explorer_admin", "course_explorer_web"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "-m",
    "not integration and not live and not slow",
]
markers = [
    "integration: tests requiring a disposable PostgreSQL database",
    "live: tests requiring an explicitly enabled public network service",
    "slow: tests driving real worker subprocesses and disposable PostgreSQL (excluded from the routine integration gate)",
]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["docs", "src/experiments", "AGENT-INSTRUCTIONS"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
